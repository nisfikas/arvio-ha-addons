      /* Αφίσα dark until the screen's own theme arrives (the factory look, THEMES.afisa.dark). */
      :root {
        --ink: #eeebe5;
        --muted: #b5b0a6;
        --bg: #141414;
        --tile: #1c1b1a;
        --line: #eeebe51f;
        --on: #f0d9a8;
        --heat: #d4a06a;
        --cool: #6aa8bc;
        --dry: #7a9ec4;
        --fan: #9aa3aa;
        --gap: 12px;
        /* What makes a theme itself. The defaults are Αφίσα; the themes are at the end of this sheet. */
        --r: 4px;
        --r-tile: 4px;
        --f-display: "Sofia Sans Extra Condensed", "Arial Narrow", "Geologica", sans-serif;
        --f-text: "Geologica", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --w-face: 800;
        --w-face-bold: 1000;
        --w-name: 800;
        --case: uppercase;
        --style: normal;
        --track: 0;
        --page: var(--bg);
        --tile-bg: var(--tile);
        --tile-border: 1px solid var(--line);
        --tile-shadow: none;
        --on-bg: var(--tile-bg);
        --on-face: var(--on);
        --on-shadow: var(--tile-shadow);
        --on-text: var(--on);
        --on-ink: #141414;
        --pick-bg: var(--ink);
        --pick-ink: var(--bg);
        --key-border: 1px solid var(--ink);
        /* The same colours as r, g, b, for rgba(). No color-mix() anywhere in this page: Android WebView
           before 111 and Safari before 16.2 lack it, and a var() inside it voids the declaration only
           when applied, so the line before it is no fallback. The NSPanel Pro has WebView 107. */
        --ink-rgb: 238, 235, 229;
        --bg-rgb: 20, 20, 20;
        --tile-rgb: 28, 27, 26;
        --on-rgb: 240, 217, 168;
        --heat-rgb: 212, 160, 106;
        --cool-rgb: 106, 168, 188;
        --dry-rgb: 122, 158, 196;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; color: var(--ink); }
      html { background: var(--bg); }
      body { background: var(--page); }
      /* An appliance, not a web page: no double-tap zoom, no grey tap flash, no long-press menu. */
      html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      body {
        font-family: var(--f-text);
        overflow: hidden;
        -webkit-user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--tile);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; }
      #gate, #board { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
      #gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      #gate.hidden, #board.hidden, #sheet.hidden, #doorbell.hidden, #doorbell-open.hidden, #doorbell-yes.hidden { display: none; }
      h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); }
      input {
        width: 12rem;
        font: inherit;
        font-size: 1.6rem;
        letter-spacing: 0.4em;
        text-align: center;
        padding: 0.7rem;
        border: 1px solid var(--line);
        background: var(--tile);
        color: var(--ink);
      }
      .err { color: #e55551; min-height: 1.2em; }
      .pages {
        display: flex;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .pages::-webkit-scrollbar { display: none; }
      .page {
        flex: 0 0 100%;
        scroll-snap-align: start;
        display: grid;
        gap: var(--gap);
        padding: var(--gap);
        padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        min-height: 100%;
      }
      html[data-orientation="landscape"] .page { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile {
        min-height: 0;
        min-width: 0;
        height: 100%;
        padding: 1rem 1.05rem;
        background: var(--tile);
        border: 1px solid var(--line);
        border-radius: var(--r, 28px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), color 0.28s ease, box-shadow 0.28s ease;
      }
      .tile:active { transform: scale(0.975); }
      .tile[data-align="center"] { text-align: center; align-items: center; }
      .tile[data-align="right"] { text-align: right; align-items: flex-end; }
      .tile-ico {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 22px;
        height: 22px;
        color: var(--muted);
        opacity: 0.72;
        pointer-events: none;
      }
      .tile-ico svg { width: 22px; height: 22px; display: block; }
      .tile-strip { display: flex; align-items: flex-end; gap: 2px; width: 40px; height: 34px; opacity: 1; }
      .tile-strip i { flex: 1 1 0; min-width: 0; background: var(--on); box-shadow: 0 0 0 0.5px rgb(128 128 128 / 0.3); }
      .tile-strip i.off { height: 2px; background: var(--muted); box-shadow: none; }
      .tile.on .tile-ico { color: var(--on); opacity: 1; }
      .tile-ico ~ .name { padding-right: 1.5rem; }
      html[data-icons="filled"] .glyph { stroke-width: 2.25; }
      .tile[data-size="m"], .tile.wide { grid-column: 1 / -1; }
      .tile[data-size="l"] { grid-column: 1 / -1; grid-row: span 2; }
      .tile--floor3d {
        padding: 8px;
        gap: 6px;
        justify-content: stretch;
      }
      .tile--shutdown {
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .tile--shutdown .face {
        font-size: 16vmin;
        font-size: clamp(2.6rem, 16vmin, 4.2rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .tile--shutdown .tile-ico { color: currentColor; opacity: 0.85; }
      html .tile--shutdown[data-shut="idle"] { background: #121212; color: #f2f2f2; }
      html .tile--shutdown[data-shut="lit"] { background: #9a7428; color: #f7f1e4; }
      html .tile--shutdown[data-shut="run"] { background: #8a2a28; color: #f7eceb; }
      .floor3d__svg {
        width: 100%;
        height: 100%;
        flex: 1;
        min-height: 0;
        display: block;
      }
      .floor3d__room {
        fill: rgba(var(--ink-rgb), 0.08);
        stroke: var(--line);
        stroke-width: 8;
        vector-effect: non-scaling-stroke;
        transition: fill 0.32s ease;
      }
      .floor3d__room.on { fill: rgba(var(--on-rgb), 0.28); }
      .floor3d__room, .floor3d__pin { cursor: pointer; }
      .floor3d__pin circle {
        fill: var(--muted);
        stroke: var(--bg);
        stroke-width: 6;
        transition: fill 0.32s ease;
      }
      .floor3d__pin.on circle { fill: var(--on); }
      .floor3d__pin.sel circle { stroke: var(--on); }
      .floor3d__name {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        border: 0;
        background: rgba(var(--bg-rgb), 0.72);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: var(--r, 12px);
        text-align: left;
      }
      @media (prefers-reduced-motion: reduce) {
        .floor3d__room, .floor3d__pin circle { transition: none; }
      }
      .tile.on { color: var(--on); }
      .kicker {
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 500;
      }
      .face {
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.06em;
        line-height: 0.95;
        font-size: 11vw;
        font-size: clamp(2.4rem, 11vw, 4.4rem);
      }
      .tile.bold .face, .sheet-clock.bold, .face.bold { font-weight: 700; }
      .tile[data-size="m"] .face { font-size: 14vw; font-size: clamp(3.4rem, 14vw, 6rem); }
      .tile[data-size="l"] .face { font-size: 22vw; font-size: clamp(5rem, 22vw, 10rem); }
      .tile--clock, .tile--weather { container-type: size; }
      .tile--clock .face, .tile--weather .face {
        line-height: 0.88;
        font-size: 9vw; /* before container units (Safari 16): close to 38cqh on a panel */
        font-size: clamp(2.8rem, 38cqh, 9rem);
      }
      .tile--clock[data-size="m"] .face, .tile--weather[data-size="m"] .face {
        font-size: 28vw;
        font-size: clamp(3.8rem, 28vw, 12rem);
        font-size: clamp(3.8rem, 46cqh, 12rem);
      }
      .tile--clock[data-size="l"] .face, .tile--weather[data-size="l"] .face {
        font-size: 28vw;
        font-size: clamp(6.2rem, 28vw, 14rem);
        font-size: clamp(6.2rem, 54cqh, 16rem);
      }
      .tile--clock .kicker, .tile--weather .kicker { font-size: 1.05rem; font-size: clamp(1.05rem, 7cqh, 1.5rem); }
      .tile--clock .state { font-size: 1.05rem; font-size: clamp(1.05rem, 8cqh, 1.65rem); }
      .tile--clock .kicker, .tile--clock .face, .tile--clock .state,
      .tile--weather .kicker, .tile--weather .face { position: relative; z-index: 1; }
      .colon { animation: colon-blink 1s steps(1) infinite; }
      .wx-sky {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .wx-glow, .wx-orb, .wx-cloud, .wx-fall { position: absolute; }
      .wx-glow { top: 0; right: 0; bottom: 0; left: 0; }
      .wx-orb {
        top: 12%;
        right: 10%;
        width: min(34%, 5.4rem);
        aspect-ratio: 1;
        border-radius: 50%;
      }
      .wx-orb::after {
        content: "";
        position: absolute;
        top: -75%; right: -75%; bottom: -75%; left: -75%;
        background: repeating-conic-gradient(from 0deg, rgba(var(--on-rgb), 0.32) 0 7deg, transparent 7deg 32deg);
        mask: radial-gradient(circle, transparent 30%, #000 32%);
        -webkit-mask: radial-gradient(circle, transparent 30%, #000 32%);
        animation: wx-spin 38s linear infinite;
      }
      .wx-cloud {
        height: 22%;
        border-radius: var(--r, 999px);
        background: rgba(var(--ink-rgb), 0.16);
        animation: wx-drift 14s ease-in-out infinite;
      }
      .wx-cloud.a { width: 44%; bottom: 24%; left: 4%; }
      .wx-cloud.b { width: 30%; height: 16%; bottom: 40%; left: 40%; opacity: 0.72; animation-delay: -5s; }
      .wx-fall { top: 0; right: 0; bottom: 0; left: 0; opacity: 0; }
      [data-wx="sun"] .wx-glow {
        background: radial-gradient(80% 70% at 82% 18%, rgba(var(--on-rgb), 0.42), transparent 58%);
      }
      [data-wx="sun"] .wx-orb, [data-wx="partly"] .wx-orb {
        background: radial-gradient(circle at 38% 36%, #fff8ea, var(--on) 58%);
        box-shadow: 0 0 42px rgba(var(--on-rgb), 0.52);
        animation: wx-pulse 5s ease-in-out infinite;
      }
      [data-wx="sun"] .wx-cloud { display: none; }
      [data-wx="sun"] .wx-fall { display: none; }
      [data-wx="partly"] .wx-glow {
        background: radial-gradient(70% 60% at 78% 16%, rgba(var(--on-rgb), 0.28), transparent 55%);
      }
      [data-wx="partly"] .wx-orb { width: min(26%, 4.2rem); top: 10%; right: 16%; }
      [data-wx="night"] .wx-glow {
        background: radial-gradient(1.5px 1.5px at 18% 22%, var(--ink), transparent),
          radial-gradient(1.2px 1.2px at 42% 18%, var(--ink), transparent),
          radial-gradient(1.4px 1.4px at 70% 28%, var(--ink), transparent),
          radial-gradient(1px 1px at 28% 48%, var(--ink), transparent),
          radial-gradient(90% 70% at 82% 12%, rgba(var(--ink-rgb), 0.12), transparent 55%);
        animation: wx-twinkle 3.8s ease-in-out infinite;
      }
      [data-wx="night"] .wx-orb {
        background: radial-gradient(circle at 35% 35%, #f4f0e6 40%, #c8c2b4 100%);
        box-shadow: 0 0 28px rgba(var(--ink-rgb), 0.18);
      }
      [data-wx="night"] .wx-orb::after, [data-wx="cloud"] .wx-orb, [data-wx="fog"] .wx-orb,
      [data-wx="rain"] .wx-orb, [data-wx="pour"] .wx-orb, [data-wx="snow"] .wx-orb,
      [data-wx="storm"] .wx-orb, [data-wx="wind"] .wx-orb { display: none; }
      [data-wx="night"] .wx-cloud { opacity: 0.22; }
      [data-wx="fog"] .wx-cloud { filter: blur(10px); opacity: 0.55; height: 42%; }
      [data-wx="wind"] .wx-cloud { animation-duration: 6s; }
      [data-wx="rain"] .wx-fall, [data-wx="pour"] .wx-fall, [data-wx="storm"] .wx-fall {
        opacity: 0.4;
        background: repeating-linear-gradient(-18deg, transparent 0 10px, rgba(var(--ink-rgb), 0.22) 10px 11px);
        background-size: 16px 28px;
        animation: wx-fall 0.55s linear infinite;
      }
      [data-wx="pour"] .wx-fall { opacity: 0.55; animation-duration: 0.38s; }
      [data-wx="snow"] .wx-fall {
        opacity: 0.55;
        background-image: radial-gradient(circle, rgba(var(--ink-rgb), 0.7) 1.1px, transparent 1.3px);
        background-size: 16px 16px;
        animation: wx-fall 2.6s linear infinite;
      }
      [data-wx="storm"] .wx-glow { animation: wx-flash 4.2s ease-in-out infinite; }
      @keyframes colon-blink { 50% { opacity: 0.18; } }

      /* aspect-ratio arrived in Safari 15: a square from padding on older iPads. */

        .wx-orb { height: 0; padding-bottom: min(34%, 5.4rem); }
      }
      /* ---- Themes. The shared rules read the tokens at the top of this sheet; sized for a 480×480 panel.
         No var() inside clamp(), cqh or other functions an old Safari lacks: it would void the declaration. ---- */
      .face, .name, .room-all, .cv-name, .lamp-name, .sheet-clock, #sheet-title, .clima-target, .wx-temp, .presets .chip {
        font-family: var(--f-display);
        font-style: var(--style);
        letter-spacing: var(--track);
        text-transform: var(--case);
      }
      .face, .sheet-clock, .clima-target, .wx-temp, .sheet-clock.bold { font-weight: var(--w-face); }
      .tile.bold .face, .sheet-clock.bold, .face.bold { font-weight: var(--w-face-bold); }
      .name, .room-all, .cv-name, .lamp-name, #sheet-title, .presets .chip { font-weight: var(--w-name); }
      .kicker:empty { display: none; }
      .tile {
        border: var(--tile-border);
        border-radius: var(--r-tile);
        background: var(--tile-bg);
        box-shadow: var(--tile-shadow);
      }
      .tile.on { background: var(--on-bg); color: var(--on-face); box-shadow: var(--on-shadow); }
      .tile.on .state, .tile.on .tile-ico, .tile.on .kicker { color: var(--on-face); opacity: 1; }
      .name { font-size: 5.4vw; font-size: clamp(1.35rem, 5.4vw, 2rem); line-height: 1.05; }
      #sheet-title { font-size: 1.8rem; line-height: 1; }
      .wx-sky .wx-cloud { border-radius: 999px; }
      .wx-sky .wx-cloud.a { width: 32%; left: 6%; bottom: 14%; }
      .wx-sky .wx-cloud.b { width: 20%; left: 22%; bottom: 30%; }
      .tile--weather:not([data-align]) .wx-sky .wx-cloud.a { left: auto; right: 6%; }
      .tile--weather:not([data-align]) .wx-sky .wx-cloud.b { left: auto; right: 22%; }
      .tile--weather[data-align="center"] .wx-sky .wx-cloud { display: none; }
      /* The sun stays clear of the words: on the far side when they are on the right. */
      .tile[data-align="right"] .wx-orb { right: auto; left: 10%; }
      html:not([data-preset="galini"]):not([data-preset="vasaltis"]) .wx-glow,
      html:not([data-preset="galini"]):not([data-preset="vasaltis"]) .wx-orb::after { display: none; }
      html:not([data-preset="galini"]):not([data-preset="vasaltis"]) .wx-sky .wx-orb { background: var(--on-text); box-shadow: none; animation: none; }
      html:not([data-preset="galini"]):not([data-preset="vasaltis"]) [data-wx="night"] .wx-cloud { display: none; }
      #sheet { background: var(--page); }
      #sheet-back { border: var(--key-border); border-radius: var(--r); }
      #sheet[data-kind="clock"] .sheet-date { display: none; }
      .presets .chip { font-size: 1.8rem; text-align: center; }
      .wx-now .wx-sky { display: none; }
      .wx-temp { font-size: 16vw; font-size: clamp(3.8rem, 16vw, 6rem); line-height: 0.9; }
      .clima-dial { flex: 0 0 auto; min-height: 0; grid-template-columns: 68px minmax(0, 1fr) 68px; }
      .clima-nudge {
        width: 68px;
        height: 68px;
        min-width: 68px;
        min-height: 68px;
        border: var(--key-border);
        border-radius: var(--r);
        background: transparent;
        font-size: 2.2rem;
        font-weight: 400;
        box-shadow: none;
      }
      .clima-target { font-size: 18vw; font-size: clamp(4rem, 18vw, 6rem); letter-spacing: var(--track); }
      .clima-k { font-size: 0.82rem; letter-spacing: 0.08em; }
      .clima-modes { gap: 6px; }
      .clima-mode {
        min-height: 58px;
        padding: 6px 4px 5px;
        color: var(--ink);
        background: var(--tile-bg);
        border: var(--tile-border);
        border-radius: var(--r);
        box-shadow: none;
      }
      .clima-mode.on { color: var(--pick-ink); background: var(--pick-bg); border-color: var(--pick-bg); box-shadow: none; }
      .clima-chip { color: var(--ink); font-size: 0.95rem; border-radius: var(--r); }
      .clima-chip.on { color: var(--pick-ink); background: var(--pick-bg); border-color: var(--pick-bg); }
      .room-all {
        align-self: stretch;
        min-height: 52px;
        border: var(--key-border);
        border-radius: var(--r);
        color: var(--ink);
        font-size: 1.25rem;
        letter-spacing: var(--track);
      }
      .lamps { gap: 8px; padding: 0; }
      .lamp {
        align-items: flex-start;
        justify-content: flex-end;
        min-height: 92px;
        padding: 12px;
        text-align: left;
        background: var(--tile-bg);
        border: var(--tile-border);
        border-radius: var(--r-tile);
      }
      .lamp-glow { display: none; }
      .lamp-name { text-align: left; color: var(--ink); font-size: 1.15rem; line-height: 1.05; letter-spacing: var(--track); }
      .lamp.on { background: var(--on); border-color: var(--on); }
      .lamp.on .lamp-name { color: var(--on-ink); }
      .cv-name { font-size: 1.25rem; line-height: 1.05; }
      .cv-card { background: var(--tile-bg); border: var(--tile-border); border-radius: var(--r-tile); }

      /* Αφίσα, the factory look, as on Σπίτι: hairlines, poster capitals, one flat colour. The narrow face can be huge. */
      html[data-preset="afisa"] .name { font-size: 7vw; font-size: clamp(1.7rem, 7vw, 2.6rem); line-height: 1; }
      html[data-preset="afisa"] .tile--clock .face, html[data-preset="afisa"] .tile--weather .face { line-height: 0.82; font-size: 18vw; font-size: clamp(4rem, 60cqh, 12rem); }
      html[data-preset="afisa"] .tile--clock[data-size="m"] .face, html[data-preset="afisa"] .tile--weather[data-size="m"] .face { font-size: 36vw; font-size: clamp(5rem, 70cqh, 18rem); }
      html[data-preset="afisa"] .tile--clock[data-size="l"] .face, html[data-preset="afisa"] .tile--weather[data-size="l"] .face { font-size: 44vw; font-size: clamp(8rem, 66cqh, 24rem); }
      html[data-preset="afisa"] .clima-target { font-size: 24vw; font-size: clamp(5rem, 24vw, 7.5rem); }
      html[data-preset="afisa"] .wx-temp { font-size: 22vw; font-size: clamp(4.8rem, 22vw, 7.5rem); }
      html[data-preset="afisa"] #sheet-title { font-size: 2.2rem; }
      html[data-preset="afisa"] .room-all, html[data-preset="afisa"] .lamp-name { font-size: 1.5rem; }
      html[data-preset="afisa"] .cv-name { font-size: 1.7rem; }
      html[data-preset="afisa"] .presets .chip { font-size: 2.2rem; }

      /* Γραφίτης, an instrument: pure black, thin silver numerals, no boxes, only rules. On = inverted. */
      html[data-preset="grafitis"] {
        --r: 0;
        --r-tile: 0;
        --f-display: "Geologica", sans-serif;
        --w-face: 200;
        --w-face-bold: 300;
        --w-name: 300;
        --case: none;
        --track: -0.03em;
        --tile-bg: transparent;
        --tile-border: 0 solid transparent;
        --on-bg: var(--ink);
        --on-face: var(--bg);
      }
      html[data-preset="grafitis"] .tile { border-bottom: 1px solid var(--line); }
      html[data-preset="grafitis"] .tile.on { border-bottom-color: var(--ink); }
      html[data-preset="grafitis"] .wx-sky .wx-orb { background: transparent; border: 1.5px solid var(--ink); }
      html[data-preset="grafitis"] .wx-sky .wx-cloud { background: transparent; border: 1px solid var(--line); }

      /* Πεντέλη, marble and a gold inscription: a Didot serif, a thin frame inside each tile. On = a gold rule. */
      html[data-preset="penteli"] {
        --r: 2px;
        --r-tile: 2px;
        --f-display: "GFS Didot", "EB Garamond", serif;
        --f-text: "EB Garamond", serif;
        --w-face: 400;
        --w-face-bold: 400;
        --w-name: 400;
        --case: none;
        --on-shadow: inset 0 -6px 0 var(--on);
        --key-border: 1px solid var(--line);
      }
      html[data-preset="penteli"] .tile { outline: 1px solid var(--line); outline-offset: -6px; }
      html[data-preset="penteli"] .state, html[data-preset="penteli"] .kicker { font-size: 1.15rem; }

      /* Δρυς, a walnut cabin: chunky warm serif, tiles raised like joinery. On = amber. */
      html[data-preset="drys"] {
        --r: 12px;
        --r-tile: 14px;
        --f-display: "Alegreya", serif;
        --f-text: "Alegreya", serif;
        --w-face: 800;
        --w-face-bold: 800;
        --w-name: 700;
        --case: none;
        --tile-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
        --on-bg: var(--on);
        --on-face: var(--on-ink);
      }
      html[data-preset="drys"] .state { font-size: 1.15rem; }

      /* Λινό, soft cloth: round lowercase, no lines at all, tiles resting on the page. On = a sage cushion. */
      html[data-preset="lino"] {
        --r: 24px;
        --r-tile: 30px;
        --f-display: "Comfortaa", sans-serif;
        --f-text: "Comfortaa", sans-serif;
        --w-face: 700;
        --w-face-bold: 700;
        --w-name: 700;
        --case: lowercase;
        --track: -0.02em;
        --tile-border: 0 solid transparent;
        --tile-shadow: 0 14px 30px rgba(46, 58, 42, 0.16);
        --on-bg: var(--on);
        --on-face: var(--on-ink);
        --key-border: 0 solid transparent;
      }
      html[data-preset="lino"] #sheet-back, html[data-preset="lino"] .clima-nudge, html[data-preset="lino"] .room-all { background: var(--tile); }
      html[data-preset="lino"] .tile--clock .face, html[data-preset="lino"] .tile--weather .face { letter-spacing: -0.06em; }

      /* Μπετόν, a building site: monospace capitals, 3px black, hard offset shadows. On = hazard yellow. */
      html[data-preset="beton"] {
        --gap: 16px;
        --r: 0;
        --r-tile: 0;
        --f-display: "Fira Code", monospace;
        --f-text: "Fira Code", monospace;
        --w-face: 700;
        --w-face-bold: 700;
        --w-name: 600;
        --track: -0.03em;
        --tile-border: 3px solid var(--ink);
        --tile-shadow: 5px 5px 0 var(--ink);
        --on-bg: #ffd400;
        --on-face: #000000;
        --key-border: 3px solid var(--ink);
      }
      html[data-preset="beton"] .lamp.on { background: #ffd400; border-color: var(--ink); }
      html[data-preset="beton"] .lamp.on .lamp-name { color: #000000; }
      html[data-preset="beton"] .state, html[data-preset="beton"] .kicker { font-size: 0.85rem; text-transform: uppercase; }
      html[data-preset="beton"] .name { font-size: 4.4vw; font-size: clamp(1.1rem, 4.4vw, 1.5rem); }
      html[data-preset="beton"] .tile--clock .face, html[data-preset="beton"] .tile--weather .face { letter-spacing: -0.08em; }
      html[data-preset="beton"] .wx-sky .wx-orb { border-radius: 0; background: #ffd400; }
      html[data-preset="beton"] .lamp, html[data-preset="beton"] .clima-mode { box-shadow: none; }

      /* Αιγαίο, Cycladic: the whole wall cobalt (or whitewash), heavy round sans. On = inverted. */
      html[data-preset="aigaio"] {
        --r: 18px;
        --r-tile: 22px;
        --f-display: "Commissioner", sans-serif;
        --f-text: "Commissioner", sans-serif;
        --w-face: 800;
        --w-face-bold: 800;
        --w-name: 700;
        --case: none;
        --track: -0.03em;
        --tile-border: 0 solid transparent;
        --on-bg: var(--ink);
        --on-face: var(--bg);
      }
      html[data-preset="aigaio"][data-mode="light"] { --on-face: #ffffff; }

      /* Ελιά, a grove: classical italics, tiles cut like leaves. On = young olive. */
      html[data-preset="elia"] {
        --r: 10px;
        --r-tile: 28px 6px 28px 6px;
        --f-display: "EB Garamond", serif;
        --f-text: "EB Garamond", serif;
        --w-face: 500;
        --w-face-bold: 600;
        --w-name: 500;
        --case: none;
        --style: italic;
        --on-bg: var(--on);
        --on-face: var(--on-ink);
      }
      html[data-preset="elia"] .state, html[data-preset="elia"] .kicker { font-size: 1.2rem; }
      html[data-preset="elia"] .name { font-size: 7vw; font-size: clamp(1.7rem, 7vw, 2.4rem); }

      /* Βασάλτης, a volcano: dark stone, tall capitals, and lava that glows. */
      html[data-preset="vasaltis"] {
        --r: 6px;
        --r-tile: 6px;
        --f-display: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
        --w-face: 700;
        --w-face-bold: 700;
        --w-name: 700;
        --track: 0.01em;
        --tile-bg: linear-gradient(170deg, var(--tile), var(--bg));
        --on-bg: linear-gradient(165deg, #d92a0c, #8f1205);
        --on-face: #ffffff;
        --on-shadow: 0 0 34px rgba(255, 74, 36, 0.55);
      }
      html[data-preset="vasaltis"] .tile--clock .face, html[data-preset="vasaltis"] .tile--weather .face { line-height: 0.85; font-size: 16vw; font-size: clamp(3.6rem, 56cqh, 11rem); }
      html[data-preset="vasaltis"] .tile--clock[data-size="m"] .face, html[data-preset="vasaltis"] .tile--weather[data-size="m"] .face { font-size: 32vw; font-size: clamp(4.6rem, 66cqh, 16rem); }
      html[data-preset="vasaltis"] .name { font-size: 7vw; font-size: clamp(1.7rem, 7vw, 2.5rem); line-height: 1; }
      html[data-preset="vasaltis"] .wx-sky .wx-orb { background: radial-gradient(circle at 40% 36%, #ffb36a, #ff4a24 62%); box-shadow: 0 0 42px rgba(255, 74, 36, 0.6); }
      html[data-preset="vasaltis"] .lamp.on { box-shadow: 0 0 26px rgba(255, 74, 36, 0.5); }

      /* Γαλήνη, the sea at dawn: a gradient behind panes of glass, the thinnest type. On = a glow. */
      html[data-preset="galini"] {
        --r: 26px;
        --r-tile: 32px;
        --f-display: "Commissioner", sans-serif;
        --f-text: "Commissioner", sans-serif;
        --w-face: 200;
        --w-face-bold: 300;
        --w-name: 400;
        --case: none;
        --track: -0.03em;
        --page: linear-gradient(165deg, #0b2b3a, #134b5c 55%, #2a6f73);
        --tile-bg: rgba(255, 255, 255, 0.09);
        --tile-border: 1px solid rgba(255, 255, 255, 0.2);
        --on-bg: rgba(143, 233, 255, 0.2);
        --on-shadow: 0 0 30px rgba(143, 233, 255, 0.35);
        --pick-bg: var(--on);
        --pick-ink: var(--on-ink);
        --key-border: 1px solid rgba(255, 255, 255, 0.35);
      }
      html[data-preset="galini"] .wx-orb::after { display: none; }
      html[data-preset="galini"][data-mode="light"] {
        --page: linear-gradient(165deg, #ffdcc8, #fde8df 42%, #bfe6ea);
        --tile-bg: rgba(255, 255, 255, 0.5);
        --tile-border: 1px solid rgba(255, 255, 255, 0.8);
        --on-bg: rgba(9, 111, 137, 0.14);
        --on-shadow: 0 0 26px rgba(9, 111, 137, 0.25);
        --key-border: 1px solid rgba(18, 54, 69, 0.35);
      }
    </style>
  </head>

                      e.state === "on" ||
                      e.state === "playing" ||
                      (e.domain === "climate" && e.state && e.state !== "off") ||
                      (e.domain === "vacuum" && (e.state === "cleaning" || e.state === "returning"));
                    return (
                      '<button type="button" class="device' +
                      (on ? " on" : "") +
                      '" data-eid="' +
                      esc(e.entity_id) +
                      '"><span>' +
                      esc(e.name) +
                      "</span><span class=\"state\">" +
                      esc(entityWord(e)) +
                      "</span></button>"
                    );
                  })
                  .join("") +
                "</div>"
              : lights.length || covers.length
                ? ""
                : "<p>Δεν υπάρχουν συσκευές σε αυτό το δωμάτιο.</p>");
        } else if (sheet.kind === "security") {
          const alarms = securityAlarms();
          const locks = securityLocks();
          const openings = securityOpenings().slice().sort((a, b) => Number(openingOpen(b)) - Number(openingOpen(a)));
          const cameras = securityCameras();
          sheetTitle.textContent = securityWord();
          sheetSub.textContent = "Μόνο προβολή";
          const rows =
            alarms.map((e) => secRow(e.name, alarmWord(e.state), e.state === "triggered" ? "alert" : "")).join("") +
            locks
              .map((e) =>
                secRow(e.name, lockWord(e.state), e.state === "unlocked" || e.state === "jammed" ? "unlocked" : ""),
              )
              .join("") +
            openings
              .map((e) => secRow(e.name, openingOpen(e) ? "ανοιχτό" : "κλειστό", openingOpen(e) ? "open" : ""))
              .join("") +
            cameras.map((e) => secRow(e.name, "κάμερα", "")).join("");
          sheetBody.innerHTML =
            (rows ? '<div class="sec">' + rows + "</div>" : "<p>Δεν υπάρχουν αισθητήρες ασφαλείας σε αυτό το σπίτι.</p>") +
            '<p class="sec-note">Ξεκλείδωμα από το κινητό</p>';
        } else if (sheet.kind === "cover") {
          const e = byId(sheet.ref);
          const kind = coverKind(e);
          const garage = kind === "garage";
          const moving = e && (e.state === "opening" || e.state === "closing");
          sheetTitle.textContent = e && e.name ? e.name : "Κάλυμμα";
          sheetSub.textContent = coverWord(e);
          sheetBody.innerHTML =
            '<div class="cv" data-cover="' +
            kind +
            '" style="--cover-fill:' +
            coverFill(e) +
            '%"><div class="cv-hero">' +
            coverWindow() +
            '</div><div class="cv-btns"><button type="button" data-cover-act="open">' +
            (garage ? "Άνοιγμα πόρτας" : "Άνοιγμα") +
            '</button><button type="button"' +
            (moving ? ' class="on"' : "") +
            ' data-cover-act="stop">Στοπ</button><button type="button" data-cover-act="close">' +
            (garage ? "Κλείσιμο πόρτας" : "Κλείσιμο") +
            "</button></div></div>";
        } else if (sheet.kind === "vacuum") {
          const e = byId(sheet.ref);
          const caps = vacuumCaps(e);
          const st = e ? e.state : "";
          const away = st === "cleaning" || st === "paused" || st === "idle" || st === "error";
          const detail = e && VAC_DETAIL[e.status] ? VAC_DETAIL[e.status] : "";
          sheetTitle.textContent = e && e.name ? e.name : "Σκούπα";
          sheetSub.textContent = (VAC_WORD[st] || entityWord(e) || "") + (detail ? " · " + detail : "");
          const area = e && e.cleaned_area != null ? Math.round(Number(e.cleaned_area)) + " m²" : "";
          const mins = e && e.cleaning_time != null ? Math.round(Number(e.cleaning_time)) + "′" : "";
          const rows =
            (vacuumBattery(e) ? secRow("Μπαταρία", vacuumBattery(e), "") : "") +
            (area || mins ? secRow("Τελευταίο καθάρισμα", [area, mins].filter(Boolean).join(" · "), "") : "") +
            (e && e.mop_fitted === false ? secRow("Σφουγγαρίστρα", "Δεν έχει μπει", "") : "");
          const primary =
            st === "cleaning" && caps.pause
              ? ["pause", "Παύση"]
              : st === "paused" && caps.start
                ? ["start", "Συνέχεια"]
                : st !== "returning" && caps.start
                  ? ["start", "Έναρξη"]
                  : null;
          sheetBody.innerHTML =
            (rows ? '<div class="sec">' + rows + "</div>" : "") +
            (caps.fan ? chipRow("Αναρρόφηση", e.fan_speed_list, e.fan_speed, "vac_fan", VAC_SUCTION) : "") +
            (e && e.mop_fitted !== false ? chipRow("Σφουγγάρισμα", e.mop_level_list, e.mop_level, "vac_mop", VAC_MOP) : "") +
            '<div class="cv-btns">' +
            (primary ? '<button type="button" class="on" data-vac-act="' + primary[0] + '">' + primary[1] + "</button>" : "") +
            (away && caps.home ? '<button type="button" data-vac-act="return_to_base">Βάση</button>' : "") +
            (caps.locate ? '<button type="button" data-vac-act="locate">Εντοπισμός</button>' : "") +
            "</div>";
        } else if (sheet.kind === "climate") {
          const e = byId(sheet.ref);
          const modes = (e && Array.isArray(e.hvac_modes) && e.hvac_modes.length ? e.hvac_modes : ["off", "heat", "cool"]);
          const mode = (e && (e.hvac_mode || e.state)) || "";
          const cur = e ? Number(e.current_temperature) : NaN;
          const target = e ? Number(e.temperature) : NaN;
          const nowWord = formatTemp(cur);

          sheetTitle.textContent = e && e.name ? e.name : "Κλιματιστικό";

          sheetBody.innerHTML =
            '<div class="clima"><div class="clima-dial">' +
            '<button type="button" class="clima-nudge" data-temp-step="-0.5" aria-label="Χαμηλότερα">−</button>' +
            '<div class="clima-face"><div class="clima-target">' +
            esc(formatTemp(target) || "—") +
            '</div><p class="clima-k">στόχος' +
            (nowWord && nowWord !== "—" ? " · τώρα " + esc(nowWord) : "") +
            "</p></div>" +
            '<button type="button" class="clima-nudge" data-temp-step="0.5" aria-label="Υψηλότερα">+</button>' +
            '</div><div class="clima-modes">' +
            modes
              .map((m) => {
                const label = HVAC[m] || m;
                return (
                  '<button type="button" class="clima-mode' +
                  (m === mode ? " on" : "") +
                  '" data-hvac="' +
                  esc(m) +
                  '">' +

                  "<span>" +
                  esc(label) +
                  "</span></button>"

              })
              .join("") +
            "</div>" +
            chipRow("Πρόγραμμα", e && e.preset_modes, e && e.preset_mode, "preset") +
            chipRow("Ανεμιστήρας", e && e.fan_modes, e && e.fan_mode, "fan") +
            chipRow("Περσίδες", e && e.swing_modes, e && e.swing_mode, "swing") +
            "</div>";
        }
      }

      async function tap(t) {
        if (t.kind === "clock") {
          openSheet({ kind: "clock", bold: !!t.bold });
          return;
        }
        if (t.kind === "weather") {
          openSheet({ kind: "weather", bold: !!t.bold });
          return;
        }
        if (t.kind === "energy") {
          openSheet({ kind: "energy" });
          return;
        }
        if (t.kind === "room") {
          openSheet(roomSheet(t.ref, t.lights));
          return;
        }
        if (t.kind === "security") {
          openSheet({ kind: "security" });
          return;
        }
        if (t.kind === "entity" && t.ref) {
          const e = byId(t.ref) || { entity_id: t.ref, domain: t.ref.split(".")[0], state: "off" };
          if (e.domain === "climate") {
            openSheet({ kind: "climate", ref: t.ref });
            return;
          }
          if (e.domain === "cover") {
            openSheet({ kind: "cover", ref: t.ref });
            return;
          }
          if (e.domain === "vacuum") {
            openSheet({ kind: "vacuum", ref: t.ref });
            return;
          }
          toggleEntity(e);
          return;
        } else if (t.kind === "allOff") {
          for (const e of lightsIn(t.ref)) {
            setOverlay(e.entity_id, { state: "off" });
            cmd("light.turn_off", e.entity_id);
          }
          return;
        } else if (t.kind === "scene" && t.ref) {
          if (t.ref.startsWith("scene.")) cmd("scene.turn_on", t.ref);
          else if (t.ref.startsWith("script.arvio_")) cmd("script.turn_on", t.ref);
          else if (t.ref.startsWith("scenario:")) {
            cmd("arvio.trigger_scenario", "", { scenario_id: t.ref.slice("scenario:".length) });
          }
        } else if (t.kind === "shutdown" && t.ref) {
          if (t.ref.startsWith("scenario:")) {
            cmd("arvio.trigger_scenario", "", { scenario_id: t.ref.slice("scenario:".length) });
          } else {
            cmd("script.turn_on", t.ref);
          }
        }
      }

      function tileInner(t) {
        if (t.kind === "clock") {
          const remain = timerRemain();
          const rec = timerRec();
          const ringing = rec && rec.ringing;
          const face = ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
          return (
            '<span class="face" data-clock="1">' +
            clockFaceHtml(face, !ringing) +
            "</span><span class=\"state\" data-clock-sub=\"1\">" +
            esc(remain && !ringing ? "χρονόμετρο" : dateText()) +
            "</span>"
          );
        }
        if (t.kind === "energy") {
          return '<span class="kicker">Ενέργεια</span><span class="face">' + esc(energyNowText()) + "</span>";
        }
        if (t.kind === "weather") {
          return (
            wxSky(snap.weather && snap.weather.condition) +
            '<span class="kicker">' +
            esc(weatherWord()) +
            '</span><span class="face">' +
            esc(weatherTemp() || "—") +
            "</span>"
          );
        }
        if (t.kind === "room") {
          const on = lightsForRoom(t.ref, t.lights).filter((e) => e.state === "on").length;
          return (
            tileGlyph(areaGlyph(t.ref)) +
            '<span class="name">' +
            esc(areaName(t.ref)) +
            '</span><span class="state">' +
            esc(on ? on + " αναμμένα" : "σβηστά") +
            "</span>"
          );
        }
        if (t.kind === "entity") {
          const e = byId(t.ref);
          if (e && e.domain === "cover") {
            return (
              coverWindow() +
              '<span class="name">' +
              esc(e.name) +
              '</span><span class="state">' +
              esc(coverWord(e)) +
              "</span>"
            );
          }
          const climateTemp = e && e.domain === "climate" ? formatTemp(Number(e.current_temperature)) : "";
          return (
            tileGlyph(glyphForEntity(e)) +
            '<span class="kicker"></span><span class="name">' +
            esc(e ? e.name : t.ref) +
            (climateTemp ? '</span><span class="face">' + esc(climateTemp) : '</span><span class="state">' + esc(entityWord(e))) +
            "</span>"
          );
        }
        if (t.kind === "scene") {
          const e = byId(t.ref);
          return sceneStrip(e && e.scene_look) + '<span class="kicker">Σκηνή</span><span class="name">' + esc(e ? e.name : t.ref) + "</span>";
        }
        if (t.kind === "shutdown") {
          return tileGlyph("power") + '<span class="face">' + esc(shutdownFace(t.ref)) + "</span>";
        }
        if (t.kind === "allOff") {
          return tileGlyph("power") + '<span class="kicker"></span><span class="name">Σβήσε όλα</span>';
        }
        if (t.kind === "security") {
          return (
            tileGlyph("shield") +
            '<span class="kicker">Ασφάλεια</span><span class="name">' +
            esc(securityWord()) +
            "</span>"
          );
        }
        if (t.kind === "floor3d") {
          const plan = planForFloor(t.ref);
          if (!plan || !(plan.rooms || []).length) {
            return '<span class="kicker">Μακέτα</span><span class="name">Όχι έτοιμο</span>';
          }
          const view = fitPlan(plan);
          const rooms = (plan.rooms || [])
            .map((r) => {
              const pts = (r.poly_cm || []).map(planPoint).filter(Boolean);
              if (pts.length < 3) return "";
              const d = pts.map((p, i) => (i ? "L" : "M") + p.x + " " + p.y).join(" ") + " Z";
              const on = lightsIn(r.area_id).some((e) => e.state === "on");
              return '<path class="floor3d__room' + (on ? " on" : "") + '" data-room="' + esc(r.area_id) + '" d="' + d + '"/>';
            })
            .join("");
          const pins = (plan.pins || [])
            .map((pin) => {
              const e = byId(pin.entity_id);
              const on = pinLit(e);
              const sel = floor3dSel === pin.entity_id;
              return (
                '<g class="floor3d__pin' +
                (on ? " on" : "") +
                (sel ? " sel" : "") +
                '" data-pin="' +
                esc(pin.entity_id) +
                '"><circle cx="' +
                pin.x_cm +
                '" cy="' +
                pin.y_cm +
                '" r="' +
                (sel ? 48 : 36) +
                '"/></g>'
              );
            })
            .join("");
          const selected = floor3dSel ? byId(floor3dSel) : null;
          return (
            '<svg class="floor3d__svg" viewBox="' +
            view.x +
            " " +
            view.y +
            " " +
            view.w +
            " " +
            view.h +
            '" role="img" aria-label="Κάτοψη">' +
            rooms +
            pins +
            "</svg>" +
            (selected
              ? '<button type="button" class="floor3d__name" data-pin-name="' +
                esc(floor3dSel) +
                '">' +
                esc(selected.name || floor3dSel) +
                "</button>"
              : "")
          );
        }
        if (t.kind === "session_countdown") {
          return (
            '<span class="kicker">Κράτηση</span><span class="face" data-session-count="1">' +
            esc((venueWall && venueWall.countdown) || "—") +
            "</span>"
          );
        }
        if (t.kind === "occupancy") {
          var occ = venueWall && venueWall.occupancy != null ? String(venueWall.occupancy) : "—";
          var max = venueWall && venueWall.occupancy_max ? "/" + venueWall.occupancy_max : "";
          return '<span class="kicker">Άτομα</span><span class="face" data-occupancy="1">' + esc(occ + max) + "</span>";
        }
        if (t.kind === "session_now") {
          var phase = venueWall && venueWall.phase ? venueWall.phase : "idle";
          var pkg = venueWall && venueWall.package_name ? venueWall.package_name : "Επόμενη";
          if (phase === "idle" && venueWall && venueWall.next_starts_at) {
            var nx = new Date(venueWall.next_starts_at);
            var nlabel = venueWall.next_package_name || "Κράτηση";
            if (!Number.isNaN(nx.getTime())) {
              nlabel += " " + new Intl.DateTimeFormat("el-GR", { ...hourOpts(), hour: "2-digit", minute: "2-digit", timeZone: tz() }).format(nx);
            }
            pkg = nlabel;
          }
          return (
            '<span class="kicker">' +
            esc(phase) +
            '</span><span class="name" data-session-now="1">' +
            esc(pkg) +
            "</span>"
          );
        }
        return '<span class="name">' + esc(t.kind) + "</span>";
      }

      function render() {
        if (!screen) return;
        document.documentElement.dataset.orientation = screen.orientation || "square";
        pagesEl.innerHTML = "";
        for (const page of screen.pages || []) {
          const el = document.createElement("section");
          el.className = "page";
          for (const t of page.tiles || []) {
            const size = tileSize(t);
            if (t.kind === "floor3d") {
              const wrap = document.createElement("div");
              wrap.className = "tile tile--floor3d" + (size !== "s" ? " wide" : "");
              wrap.dataset.size = size;
              wrap.innerHTML = tileInner(t);
              wrap.querySelectorAll("[data-pin]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tapPin(el.getAttribute("data-pin"));
                });
              });
              wrap.querySelectorAll("[data-pin-name]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  armFloorIdle();
                  openPinSheet(el.getAttribute("data-pin-name"));
                });
              });
              wrap.querySelectorAll("[data-room]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tap({ kind: "room", ref: el.getAttribute("data-room") });
                });
              });
              el.appendChild(wrap);
              continue;
            }
            const b = document.createElement("button");
            b.type = "button";
            b.className = "tile tile--" + t.kind + (size !== "s" ? " wide" : "") + (tileOn(t) ? " on" : "") + (t.bold ? " bold" : "");
            b.dataset.size = size;
            if (t.align === "center" || t.align === "right") b.dataset.align = t.align;
            if (t.kind === "shutdown") b.dataset.shut = shutdownMode(t);
            if (t.kind === "entity") {
              const ent = byId(t.ref);
              if (ent && ent.domain === "cover") {
                b.classList.add("tile--cover");
                b.dataset.cover = coverKind(ent);
                b.style.setProperty("--cover-fill", coverFill(ent) + "%");
              }
            }
            b.innerHTML = tileInner(t);
            b.addEventListener("click", () => tap(t));
            el.appendChild(b);
          }
          pagesEl.appendChild(el);
        }
        const kids = pagesEl.children;
        // scrollIntoView would also scroll the Partner page around the preview.
        if (PREVIEW) pagesEl.scrollLeft = pageIx * pagesEl.clientWidth;
        else if (kids[pageIx]) kids[pageIx].scrollIntoView({ inline: "start", block: "nearest" });
      }

      function paintTime() {
        const rec = timerRec();
        if (rec && rec.end && Date.now() >= rec.end && !rec.ringing) {
          rec.ringing = true;
          localStorage.setItem(TIMER_KEY, JSON.stringify(rec));
          if (!sheet || sheet.kind !== "clock") openSheet({ kind: "clock" });
        }
        if (rec && rec.ringing && Date.now() - lastBeep > 2000) {
          lastBeep = Date.now();
          beep();
        }
        const remain = timerRemain();
        const ringing = rec && rec.ringing;
        const face = ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
        document.querySelectorAll("[data-clock]").forEach((el) => {
          if (ringing || !el.querySelector(".colon")) {
            el.innerHTML = clockFaceHtml(face, !ringing);
            return;
          }
          const i = String(face).lastIndexOf(":");
          if (i < 1) {
            el.innerHTML = clockFaceHtml(face, !ringing);
            return;
          }
          const h = el.querySelector(".h");
          const m = el.querySelector(".m");
          if (h) h.textContent = face.slice(0, i);
          if (m) m.textContent = face.slice(i + 1);
        });
        document.querySelectorAll("[data-clock-sub]").forEach((el) => {
          el.textContent = remain && !ringing ? "χρονόμετρο" : dateText();
        });
        document.querySelectorAll("[data-date]").forEach((el) => {
          el.textContent = dateText();
        });
        if (sheet && sheet.kind === "clock") {
          sheetSub.textContent = ringing ? "Τέλος" : remain ? "Χρονόμετρο " + formatCountdown(remain) : dateText();
        }
        var sessionFace = (venueWall && venueWall.countdown) || "—";
        if (venueWall && venueWall.ends_at) {
          var left = Date.parse(venueWall.ends_at) - Date.now();
          if (Number.isFinite(left) && left > 0) sessionFace = formatCountdown(left);
          else if (Number.isFinite(left)) sessionFace = "—";
        }
        document.querySelectorAll("[data-session-count]").forEach((el) => {
          el.textContent = sessionFace;
        });
        var occFace = venueWall && venueWall.occupancy != null ? String(venueWall.occupancy) : "—";
        if (venueWall && venueWall.occupancy_max) occFace += "/" + venueWall.occupancy_max;
        document.querySelectorAll("[data-occupancy]").forEach((el) => {
          el.textContent = occFace;
        });
        document.querySelectorAll("[data-session-now]").forEach((el) => {
          var phase = venueWall && venueWall.phase ? venueWall.phase : "idle";
          var pkg = (venueWall && venueWall.package_name) || "Επόμενη";
          if (phase === "idle" && venueWall && venueWall.next_starts_at) {
            var nx = new Date(venueWall.next_starts_at);
            var nlabel = (venueWall.next_package_name || "Κράτηση");
            if (!Number.isNaN(nx.getTime())) {
              nlabel += " " + new Intl.DateTimeFormat("el-GR", { ...hourOpts(), hour: "2-digit", minute: "2-digit", timeZone: tz() }).format(nx);
            }
            pkg = nlabel;
          }
          el.textContent = pkg;
        });
      }

      let wallpaperFor = "";
      let wallpaperUrl = "";
      async function applyWallpaper(s) {
        const want = s && s.has_wallpaper ? s.screen_id + "|" + (s.updated_at || "") : "";
        if (want !== wallpaperFor) {
          wallpaperFor = want;
          let url = "";
          if (want) {
            try {
              url = s.preview_wallpaper_url || (await screenBlobUrl("/api/screens/wallpaper?id=" + encodeURIComponent(s.screen_id)));
            } catch (e) {}
            if (wallpaperFor !== want) {
              if (url) URL.revokeObjectURL(url);
              return;
            }
            if (!url) wallpaperFor = "";
          }
          if (wallpaperUrl) URL.revokeObjectURL(wallpaperUrl);
          wallpaperUrl = url;
        }
        if (wallpaperUrl) {
          var a = Number(s.wallpaper_scrim);
          if (!isFinite(a)) a = 0.55;
          a = Math.min(0.9, Math.max(0.1, a));
          var rgb = hexRgb(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
          document.body.style.backgroundImage =
            "linear-gradient(rgba(" + rgb + "," + a + "), rgba(" + rgb + "," + a + ")), url('" + wallpaperUrl + "')";
          document.body.style.backgroundSize = "cover";
          document.body.style.backgroundPosition = "center";
        } else {
          document.body.style.backgroundImage = "";
        }
      }

      let doorbellImgUrl = "";
      let doorbellBusy = false;
      function setDoorbellImg(url) {
        if (doorbellImgUrl) URL.revokeObjectURL(doorbellImgUrl);
        doorbellImgUrl = url;
        if (url) doorbellImg.src = url;
        else doorbellImg.removeAttribute("src");
      }
      function doorbellNotice(code) {
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.add("hidden");
        doorbellTitle.textContent = DOOR_LINES[code];
      }
      async function pullDoorbellJpeg() {
        if (doorbellBusy || !screen) return;
        doorbellBusy = true;
        try {
          const url = await screenBlobUrl("/api/screens/doorbell.jpg?id=" + encodeURIComponent(screen.screen_id), {
            cache: "no-store",
          });
          if (doorbellJpegTimer) setDoorbellImg(url);
          else URL.revokeObjectURL(url);
        } catch (e) {
          if (e.message === "repair_required" && doorbellJpegTimer) {
            stopDoorbellJpeg();
            doorbellNotice("repair_required");
          }
        } finally {
          doorbellBusy = false;
        }
      }
      function stopDoorbellJpeg() {
        if (doorbellJpegTimer) {
          clearInterval(doorbellJpegTimer);
          doorbellJpegTimer = null;
        }
        setDoorbellImg("");
      }
      function startDoorbellJpeg() {
        if (doorbellJpegTimer) return;
        doorbellJpegTimer = setInterval(pullDoorbellJpeg, 1000);
        pullDoorbellJpeg();
      }
      function hideDoorbell() {
        doorbellEl.classList.add("hidden");
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.add("hidden");
        doorbellTitle.textContent = "Κάποιος στο κουδούνι";
        stopDoorbellJpeg();
      }
      function showDoorbell() {
        if (!doorbellEl.classList.contains("hidden")) return;
        const db = screen && screen.doorbell;
        doorbellEl.classList.remove("hidden");
        doorbellYes.classList.add("hidden");
        if (db && db.unlock_entity_id) doorbellOpen.classList.remove("hidden");
        else doorbellOpen.classList.add("hidden");
        startDoorbellJpeg();
      }
      function syncDoorbell() {
        const db = screen && screen.doorbell;
        const ringing = Boolean(db && db.ringing);
        if (!ringing) {
          doorbellWasRinging = false;
          doorbellDismissed = false;
          hideDoorbell();
          return;
        }
        if (!doorbellWasRinging) doorbellDismissed = false;
        doorbellWasRinging = true;
        if (doorbellDismissed) {
          hideDoorbell();
          return;
        }
        showDoorbell();
      }

      async function load(keepPage) {
        const sid = localStorage.getItem(KEY);
        if (!sid) {
          screen = null;
          gate.classList.remove("hidden");
          board.classList.add("hidden");
          applyTheme(null);
          applyWallpaper(null);
          hideDoorbell();
          closeSheet();
          return;
        }
        let next;
        try {
          const r = await screenFetch("/api/screens?screen_id=" + encodeURIComponent(sid));
          if (r.status === 403 || r.status === 404) {
            // Screen deleted on the hub, or paired again elsewhere (new secret): after
            // three misses in a row, back to the code field.
            miss += 1;
            if (miss < 3) return;
            miss = 0;
            localStorage.removeItem(KEY);
            localStorage.removeItem(SECRET_KEY);
            return load(false);
          }
          if (!r.ok) return;
          next = await r.json();
        } catch (e) {
          return;
        }
        if (!next || !Array.isArray(next.screens)) return;
        const found = next.screens.find((s) => s.screen_id === sid) || null;
        if (!found) return;
        miss = 0;
        lastGood = Date.now();
        // «Επανεκκίνηση» in Partner; the hub gives this order once. The app from 0.1.1 restarts the
        // panel; an older app, an iPad or a browser reload the page.
        if (found.restart) {
          if (window.ArvioPanel && window.ArvioPanel.reboot) window.ArvioPanel.reboot();
          else location.reload();
          return;
        }
        snap = next;
        pruneOverlay();
        hubId = snap.hub_id || hubId;
        screen = found;
        if (!keepPage) pageIx = 0;
        // Partner issued a new code for this screen: show the code field to pair again.
        gate.classList.toggle("hidden", !found.pairing_pending);
        board.classList.toggle("hidden", !!found.pairing_pending);
        applyTheme(screen);
        applyWallpaper(screen);
        try {
          const wr = await fetch("/api/venue/wall");
          if (wr.ok) venueWall = await wr.json();
        } catch (e) {}
        render();
        if (sheet) renderSheet();
        syncDoorbell();
        paintTime();
        if (found.screenshot) takeScreenshot(sid);
      }

      // «Στιγμιότυπο» in Partner, asked once by the hub: what this window shows, taken by the Arvio Panel
      // app. Never with the doorbell's camera or an open sheet on screen: those answer «private».
      let shotBusy = false;
      async function takeScreenshot(sid) {
        if (shotBusy) return;
        shotBusy = true;
        let body;
        if (!doorbellEl.classList.contains("hidden") || sheet) body = { screen_id: sid, refused: "private" };
        else if (!(window.ArvioPanel && window.ArvioPanel.screenshot)) body = { screen_id: sid, refused: "no_app" };
        else {
          try {
            body = { screen_id: sid, image: await nativeShot() };
          } catch (e) {
            body = { screen_id: sid, refused: "capture_failed" };
          }
        }
        try {
          await screenFetch("/api/screens/screenshot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } catch (e) {
          // the order stands until it expires: the next read tries again
        }
        shotBusy = false;
      }
      function nativeShot() {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.__arvioShot = null;
            reject(new Error("timeout"));
          }, 8000);
          window.__arvioShot = (data) => {
            clearTimeout(timer);
            window.__arvioShot = null;
            if (typeof data === "string" && data.indexOf("data:image/jpeg;base64,") === 0) resolve(data);
            else reject(new Error("capture_failed"));
          };
          window.ArvioPanel.screenshot();
        });
      }

      async function pair() {
        gateErr.textContent = "";
        const code = document.getElementById("code").value.replace(/\D/g, "");
        if (code.length !== 6) {
          gateErr.textContent = "Έξι ψηφία.";
          return;
        }
        await pairWith({ code }, "Λάθος ή ληγμένος κωδικός.");
      }

      // { code } typed from Partner, or { token } from the hub when it installs the Arvio Panel app.
      async function pairWith(payload, failText) {
        const r = await screenFetch("/api/screens/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await r.json().catch(() => ({}));
        if (r.status === 429) {
          gateErr.textContent = "Πολλές λάθος προσπάθειες. Ξανά σε 15 λεπτά.";
          return false;
        }
        if (!r.ok || !body.screen_id) {
          gateErr.textContent = failText;
          return false;
        }
        localStorage.setItem(KEY, body.screen_id);
        if (body.screen_secret) localStorage.setItem(SECRET_KEY, body.screen_secret);
        else localStorage.removeItem(SECRET_KEY);
        document.getElementById("code").value = "";
        await load(false);
        armHomeIdle();
        return true;
      }

      document.getElementById("pair").addEventListener("click", pair);
      document.getElementById("code").addEventListener("keydown", (e) => {
        if (e.key === "Enter") pair();
      });
      document.getElementById("sheet-back").addEventListener("click", sheetBack);
      sheetEl.addEventListener("click", async (e) => {
        armSheet();
        const min = e.target.getAttribute && e.target.getAttribute("data-min");
        if (min) startTimer(Number(min));
        if (e.target.getAttribute && e.target.getAttribute("data-cancel")) clearTimer();
        if (e.target.getAttribute && e.target.getAttribute("data-ack")) ackTimer();
        const allOffBtn = e.target.closest && e.target.closest("[data-alloff]");
        if (allOffBtn && sheet && sheet.kind === "room") {
          const lights = lightsForRoom(sheet.ref, sheet.lights);
          const anyOn = lights.some((x) => x.state === "on");
          const next = anyOn ? "off" : "on";
          for (const ent of lights) {
            setOverlay(ent.entity_id, { state: next });
            cmd(anyOn ? "light.turn_off" : "light.turn_on", ent.entity_id);
          }
          return;
        }
        const stepBtn = e.target.closest && e.target.closest("[data-temp-step]");
        if (stepBtn && sheet && sheet.kind === "climate") {
          const ent = byId(sheet.ref);
          const cur = ent ? Number(ent.temperature) : NaN;
          const next = (isFinite(cur) ? cur : 21) + Number(stepBtn.getAttribute("data-temp-step"));
          const lo = ent ? Number(ent.min_temp) : NaN;
          const hi = ent ? Number(ent.max_temp) : NaN;
          const clamped = Math.min(isFinite(hi) ? hi : 32, Math.max(isFinite(lo) ? lo : 16, next));
          const temp = Math.round(clamped * 2) / 2;
          const eid = sheet.ref;
          setOverlay(eid, { temperature: temp });
          clearTimeout(tempCommitTimer);
          tempCommitTimer = setTimeout(() => {
            cmd("climate.set_temperature", eid, { temperature: temp });
          }, 400);
          return;
        }
        const hvacBtn = e.target.closest && e.target.closest("[data-hvac]");
        if (hvacBtn && sheet && sheet.kind === "climate") {
          const mode = hvacBtn.getAttribute("data-hvac");
          setOverlay(sheet.ref, { hvac_mode: mode, state: mode });
          cmd("climate.set_hvac_mode", sheet.ref, { hvac_mode: mode });
          return;
        }
        const climaBtn = e.target.closest && e.target.closest("[data-clima]");
        if (climaBtn && sheet && sheet.kind === "climate") {
          const kind = climaBtn.getAttribute("data-clima");
          const val = climaBtn.getAttribute("data-val");
          if (kind === "preset") {
            setOverlay(sheet.ref, { preset_mode: val });
            cmd("climate.set_preset_mode", sheet.ref, { preset_mode: val });
          } else if (kind === "fan") {
            setOverlay(sheet.ref, { fan_mode: val });
            cmd("climate.set_fan_mode", sheet.ref, { fan_mode: val });
          } else if (kind === "swing") {
            setOverlay(sheet.ref, { swing_mode: val });
            cmd("climate.set_swing_mode", sheet.ref, { swing_mode: val });
          }
          return;
        }
        const vacChip = e.target.closest && e.target.closest('[data-clima^="vac_"]');
        if (vacChip && sheet && sheet.kind === "vacuum") {
          const val = vacChip.getAttribute("data-val");
          if (vacChip.getAttribute("data-clima") === "vac_fan") {
            setOverlay(sheet.ref, { fan_speed: val });
            cmd("vacuum.set_fan_speed", sheet.ref, { fan_speed: val });
          } else {
            setOverlay(sheet.ref, { mop_level: val });
            cmd("vacuum.set_mop_level", sheet.ref, { level: val });
          }
          return;
        }
        const vacBtn = e.target.closest && e.target.closest("[data-vac-act]");
        if (vacBtn && sheet && sheet.kind === "vacuum") {
          vacuumCommand(byId(sheet.ref), vacBtn.getAttribute("data-vac-act"));
          return;
        }
        const coverBtn = e.target.closest && e.target.closest("[data-cover-act]");
        if (coverBtn && sheet && sheet.kind === "cover") {
          coverCommand(byId(sheet.ref), coverBtn.getAttribute("data-cover-act"));
          return;
        }
        const eid = e.target.closest && e.target.closest("[data-eid]");
        if (eid) {
          const ent = byId(eid.getAttribute("data-eid"));
          if (ent && ent.domain === "climate") {
            openSheet({
              kind: "climate",
              ref: ent.entity_id,
              parent: sheet && sheet.kind === "room" ? roomSheet(sheet.ref, sheet.lights) : undefined,
            });
            return;
          }
          if (ent && (ent.domain === "cover" || ent.domain === "vacuum")) {
            openSheet({
              kind: ent.domain,
              ref: ent.entity_id,
              parent: sheet && sheet.kind === "room" ? roomSheet(sheet.ref, sheet.lights) : undefined,
            });
            return;
          }
          toggleEntity(ent);
        }
      });
      document.getElementById("doorbell-dismiss").addEventListener("click", () => {
        doorbellDismissed = true;
        hideDoorbell();
      });
      doorbellOpen.addEventListener("click", () => {
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.remove("hidden");
        doorbellTitle.textContent = "Να ανοίξει η πόρτα;";
      });
      doorbellYes.addEventListener("click", async () => {
        if (!screen) return;
        doorbellYes.disabled = true;
        let error = "";
        try {
          const r = await screenFetch("/api/screens/doorbell/unlock", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ screen_id: screen.screen_id }),
          });
          if (!r.ok) error = (await r.json().catch(() => ({}))).error || "";
        } catch (e) {}
        doorbellYes.disabled = false;
        if (DOOR_LINES[error]) {
          doorbellNotice(error);
          return;
        }
        doorbellDismissed = true;
        hideDoorbell();
      });
      pagesEl.addEventListener("scroll", () => {
        const w = pagesEl.clientWidth || 1;
        pageIx = Math.round(pagesEl.scrollLeft / w);
      });
      // Pointer events arrived in iOS 13; older iPads only send touches.
      document.addEventListener("pointerdown", armHomeIdle, { passive: true });
      document.addEventListener("touchstart", armHomeIdle, { passive: true });

      (async () => {
        if (PREVIEW) {
          gate.classList.add("hidden");
          window.addEventListener("message", (ev) => {
            const p = ev.origin === location.origin && ev.data && ev.data.arvioPreview;
            if (!p) return;
            snap = p.snap;
            screen = p.screen;
            pageIx = p.page || 0;
            board.classList.remove("hidden");
            applyTheme(screen);
            applyWallpaper(screen);
            render();
            paintTime();
          });
          setInterval(paintTime, 1000);
          return;
        }
        try {
          const h = await fetch("/health").then((r) => r.json());
          hubId = h.hub_id;
          pageVersion = h.agent_version || "";
        } catch (e) {}
        // The app opens /panel#pair=<token> once, right after the hub installed it. The token
        // leaves the address bar before anything else runs; it is never sent as a URL.
        const pairToken = (location.hash.match(/^#pair=([A-Za-z0-9_-]{43})$/) || [])[1];
        if (pairToken) history.replaceState(null, "", location.pathname + location.search);
        // An iPad's home-screen icon keeps its first URL, #pair= included: once that iPad is
        // paired, the spent token is left alone instead of counting as a wrong attempt.
        const spent = pairToken && navigator.standalone && localStorage.getItem(KEY);
        const paired =
          pairToken &&
          !spent &&
          (await pairWith({ token: pairToken }, "Η αυτόματη σύζευξη δεν έγινε. Βάλε τον κωδικό από τον Partner."));
        if (!paired && localStorage.getItem(KEY)) {
          gate.classList.add("hidden");
          await load(true).catch(() => {});
          armHomeIdle();
        }
        setInterval(() => {
          if (localStorage.getItem(KEY)) load(true).catch(() => {});
        }, 4000);
        setInterval(paintTime, 1000);
      })();

      // Arvio Panel app (docs/ADR/012): a heartbeat; without it for 2 min the app replaces a
      // hung page. A browser has no ArvioPanel, so this does nothing there.
      // alive(true) once paired: the app (device owner, release build) then locks ADB away.
      const beat = () => window.ArvioPanel && window.ArvioPanel.alive(!!localStorage.getItem(KEY));
      beat();
      setInterval(beat, 30000);

      // An agent update brings a new version of this page, and nothing else would reload it: the app
      // loads it once. Without the app (an iPad, any browser) the page also looks after itself: a
      // fresh start when the hub has answered nothing useful for 3 min, and every night at 04:00 (old
      // Safari leaks memory over days). All only when /health answers, so no error page ever shows.
      const PAGE_BORN = Date.now();
      setInterval(async () => {
        if (PREVIEW || !localStorage.getItem(KEY)) return;
        const stale = !window.ArvioPanel && Date.now() - lastGood > 3 * 60000; // the app has its own watchdog
        const nightly = !window.ArvioPanel && new Date().getHours() === 4 && Date.now() - PAGE_BORN > 3600000;
        try {
          const r = await fetch("/health", { cache: "no-store" });
          if (!r.ok) return;
          const v = (await r.json()).agent_version || "";
          if (!pageVersion) pageVersion = v;
          if (stale || nightly || (v && v !== pageVersion)) location.reload();
        } catch (e) {}
      }, 60000);
    </script>
  </body>
</html>

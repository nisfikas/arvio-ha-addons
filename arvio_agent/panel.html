<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Arvio</title>
    <style>
      :root {
        --ink: #f2f2f2;
        --muted: #9a9a9a;
        --bg: #050505;
        --tile: #121212;
        --line: #f2f2f218;
        --on: #f6e2c0;
        --heat: #d4a06a;
        --cool: #6aa8bc;
        --dry: #7a9ec4;
        --fan: #9aa3aa;
        --gap: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--tile);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; }
      #gate, #board { position: absolute; inset: 0; }
      #gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      #gate.hidden, #board.hidden, #sheet.hidden, #doorbell.hidden { display: none; }
      h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); }
      input {
        width: 12rem;
        font: inherit;
        font-size: 1.6rem;
        letter-spacing: 0.4em;
        text-align: center;
        padding: 0.7rem;
        border: 1px solid var(--line);
        background: var(--tile);
        color: var(--ink);
      }
      .err { color: #e55551; min-height: 1.2em; }
      .pages {
        display: flex;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .pages::-webkit-scrollbar { display: none; }
      .page {
        flex: 0 0 100%;
        scroll-snap-align: start;
        display: grid;
        gap: var(--gap);
        padding: var(--gap);
        padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        min-height: 100%;
      }
      html[data-orientation="landscape"] .page { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile {
        min-height: 0;
        min-width: 0;
        height: 100%;
        padding: 1rem 1.05rem;
        background: var(--tile);
        border: 1px solid var(--line);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        position: relative;
      }
      .tile-ico {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 22px;
        height: 22px;
        color: var(--muted);
        opacity: 0.72;
        pointer-events: none;
      }
      .tile-ico svg { width: 22px; height: 22px; display: block; }
      .tile.on .tile-ico { color: var(--on); opacity: 1; }
      .tile-ico ~ .name { padding-right: 1.5rem; }
      html[data-icons="filled"] .glyph { stroke-width: 2.25; }
      html[data-mode="light"] .tile {
        box-shadow: 0 10px 28px rgba(20, 28, 36, 0.08);
      }
      .tile[data-size="m"], .tile.wide { grid-column: 1 / -1; }
      .tile[data-size="l"] { grid-column: 1 / -1; grid-row: span 2; }
      .tile--floor3d {
        padding: 8px;
        gap: 6px;
        justify-content: stretch;
      }
      .floor3d__svg {
        width: 100%;
        height: 100%;
        flex: 1;
        min-height: 0;
        display: block;
      }
      .floor3d__room {
        fill: color-mix(in srgb, var(--ink) 8%, var(--tile));
        stroke: var(--line);
        stroke-width: 8;
        vector-effect: non-scaling-stroke;
        transition: fill 0.32s ease;
      }
      .floor3d__room.on { fill: color-mix(in srgb, var(--on) 28%, var(--tile)); }
      .floor3d__room, .floor3d__pin { cursor: pointer; }
      .floor3d__pin circle {
        fill: var(--muted);
        stroke: var(--bg);
        stroke-width: 6;
        transition: fill 0.32s ease;
      }
      .floor3d__pin.on circle { fill: var(--on); }
      .floor3d__pin.sel circle { stroke: var(--on); }
      .floor3d__name {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        border: 0;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 12px;
        text-align: left;
      }
      @media (prefers-reduced-motion: reduce) {
        .floor3d__room, .floor3d__pin circle { transition: none; }
      }
      .tile.on { color: var(--on); }
      .kicker {
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 500;
      }
      .face {
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.06em;
        line-height: 0.95;
        font-size: clamp(2.4rem, 11vw, 4.4rem);
      }
      .tile.bold .face, .sheet-clock.bold, .face.bold { font-weight: 700; }
      .tile[data-size="m"] .face { font-size: clamp(3.4rem, 14vw, 6rem); }
      .tile[data-size="l"] .face { font-size: clamp(5rem, 22vw, 10rem); }
      .tile--clock .kicker, .tile--weather .kicker { font-size: 1.05rem; }
      .name {
        font-size: clamp(1.15rem, 3.6vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .state { font-size: 1.05rem; color: var(--muted); }
      .tile.on .state { color: var(--on); opacity: 0.85; }
      #sheet {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 16px;
      }
      #sheet-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #sheet-back {
        width: 56px;
        height: 56px;
        min-width: 56px;
        min-height: 56px;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--line);
      }
      #sheet-back svg { display: block; }
      #sheet-title {
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      #sheet-sub { font-size: 1rem; }
      #sheet-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
      #sheet[data-kind="climate"] {
        padding-top: 12px;
      }
      #sheet[data-kind="climate"] #sheet-body { overflow: hidden; }
      #sheet[data-hvac="heat"] {
        background: radial-gradient(120% 90% at 50% -8%, rgba(212, 160, 106, 0.34), transparent 64%), var(--bg);
      }
      #sheet[data-hvac="cool"] {
        background: radial-gradient(120% 90% at 50% -8%, rgba(106, 168, 188, 0.32), transparent 64%), var(--bg);
      }
      #sheet[data-hvac="dry"] {
        background: radial-gradient(120% 90% at 50% -8%, rgba(122, 158, 196, 0.28), transparent 64%), var(--bg);
      }
      html[data-mode="light"] #sheet[data-hvac="heat"] {
        background: radial-gradient(120% 90% at 50% -8%, rgba(212, 160, 106, 0.22), transparent 64%), var(--bg);
      }
      html[data-mode="light"] #sheet[data-hvac="cool"] {
        background: radial-gradient(120% 90% at 50% -8%, rgba(106, 168, 188, 0.2), transparent 64%), var(--bg);
      }
      .clima {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 14px;
      }
      .clima-hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      .clima-now {
        font-variant-numeric: tabular-nums;
        font-weight: 200;
        letter-spacing: -0.07em;
        line-height: 0.88;
        font-size: clamp(4.2rem, 22vw, 7.2rem);
      }
      .clima-now-k {
        margin-top: 0.35rem;
        font-size: 0.95rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .clima-set {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--tile);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 10px;
        max-width: 22rem;
        width: 100%;
        margin: 0 auto;
      }
      .clima-set button {
        width: 56px;
        height: 56px;
        min-width: 56px;
        min-height: 56px;
        border-radius: 50%;
        border: 0;
        background: var(--bg);
        font-size: 1.7rem;
        font-weight: 300;
        line-height: 1;
      }
      .clima-target {
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-size: 2.1rem;
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .clima-target-k {
        margin-top: 0.2rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .clima-modes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .clima-mode {
        min-height: 76px;
        border-radius: 20px;
        padding: 10px 6px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 0.78rem;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        background: var(--tile);
        border: 1px solid transparent;
      }
      .clima-mode svg { display: block; }
      .clima-mode.on { color: var(--on); border-color: var(--on); }
      .clima-mode[data-hvac="heat"].on { color: var(--heat); border-color: rgba(212, 160, 106, 0.45); }
      .clima-mode[data-hvac="cool"].on { color: var(--cool); border-color: rgba(106, 168, 188, 0.45); }
      .clima-mode[data-hvac="dry"].on { color: var(--dry); border-color: rgba(122, 158, 196, 0.45); }
      .clima-mode[data-hvac="fan_only"].on { color: var(--fan); }
      .sheet-clock {
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.07em;
        font-size: clamp(5rem, 24vw, 10rem);
        line-height: 0.9;
      }
      .sheet-date { font-size: 1.25rem; color: var(--muted); }
      .presets, .devices { display: grid; gap: 12px; }
      .presets { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .devices { grid-template-columns: 1fr; }
      .chip, .device {
        min-height: 72px;
        border-radius: 28px;
        padding: 0 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 1.2rem;
      }
      .chip.on { color: var(--on); }
      .step {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .step button {
        min-width: 72px;
        min-height: 72px;
        border-radius: 28px;
        font-size: 2rem;
      }
      .device.on { color: var(--on); }
      .wx-now { display: flex; flex-direction: column; gap: 0.4rem; }
      .wx-days { display: grid; gap: 8px; }
      .wx-day {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 56px;
        font-size: 1.15rem;
        color: var(--muted);
      }
      .wx-day b { color: var(--ink); font-weight: 500; }
      #doorbell {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: flex;
        flex-direction: column;
        background: #050505;
      }
      #doorbell-img {
        flex: 1;
        width: 100%;
        object-fit: cover;
        background: #121212;
      }
      #doorbell-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        align-items: center;
      }
      #doorbell-bar p { flex: 1 1 8rem; color: var(--ink); }
      #doorbell-confirm { color: var(--on); }
      #doorbell-bar button { min-height: 72px; border-radius: 28px; padding: 0 1.2rem; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <section id="gate">
      <h1>Arvio</h1>
      <p>Κωδικός 6 ψηφίων από τον Partner</p>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <button type="button" id="pair">Σύνδεση</button>
      <p class="err" id="gate-err"></p>
    </section>
    <main id="board" class="hidden">
      <div class="pages" id="pages"></div>
    </main>
    <section id="sheet" class="hidden">
      <div id="sheet-top">
        <button type="button" id="sheet-back" aria-label="Πίσω">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-join="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div>
          <div id="sheet-title"></div>
          <p id="sheet-sub"></p>
        </div>
      </div>
      <div id="sheet-body"></div>
    </section>
    <aside id="doorbell" class="hidden">
      <img id="doorbell-img" alt="" />
      <div id="doorbell-bar">
        <p id="doorbell-title">Κάποιος στο κουδούνι</p>
        <button type="button" id="doorbell-open" class="hidden">Άνοιγμα πόρτας</button>
        <button type="button" id="doorbell-yes" class="hidden">Ναι, άνοιξε</button>
        <button type="button" id="doorbell-dismiss">Κλείσιμο</button>
      </div>
    </aside>
    <script>
      const KEY = "arvio.panel.screen_id";
      const TIMER_KEY = "arvio.panel.timer";
      const WX = {
        "clear-night": "Καθαρός",
        cloudy: "Συννεφιά",
        fog: "Ομίχλη",
        hail: "Χαλάζι",

        "lightning-rainy": "Καταιγίδα",
        partlycloudy: "Αραιή συννεφιά",
        pouring: "Έντονη βροχή",
        rainy: "Βροχή",
        snowy: "Χιόνι",
        "snowy-rainy": "Χιονόνερο",
        sunny: "Ηλιοφάνεια",
        windy: "Άνεμος",
        "windy-variant": "Άνεμος",
      };
      const HVAC = {
        off: "Κλειστό",
        heat: "Θέρμανση",
        cool: "Ψύξη",
        heat_cool: "Αυτόματο",
        auto: "Αυτόματο",
        dry: "Αφύγρανση",
        fan_only: "Ανεμιστήρας",
      };
      const THEMES = {
        grafitis: {
          dark: { bg: "#050505", tile: "#121212", ink: "#f2f2f2", muted: "#b8b8b8", on: "#f0d9a8", line: "#f2f2f218" },

      };
      const ICONS = {
        back: '<path d="M15 5l-7 7 7 7"/>',
        bulb: '<path d="M8.5 14.5a6 6 0 1 1 7 0c-.6.6-1 1.2-1 2.5h-5c0-1.3-.4-1.9-1-2.5Z"/><path d="M9.5 20h5"/>',
        flame: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9Z"/>',

        shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/>',
      };
      const ROOM_DOMAINS = { light: 1, switch: 1, cover: 1, climate: 1, media_player: 1 };
      const gate = document.getElementById("gate");
      const board = document.getElementById("board");
      const pagesEl = document.getElementById("pages");
      const gateErr = document.getElementById("gate-err");
      const sheetEl = document.getElementById("sheet");
      const sheetTitle = document.getElementById("sheet-title");
      const sheetSub = document.getElementById("sheet-sub");
      const sheetBody = document.getElementById("sheet-body");
      let hubId = null;
      let snap = { screens: [], entities: [], areas: [], weather: null, timezone: "Europe/Athens" };
      let screen = null;
      let pageIx = 0;
      let sheet = null;
      let sheetTimer = 0;
      let doorbellWasRinging = false;
      let doorbellDismissed = false;
      let doorbellJpegTimer = null;
      let lastBeep = 0;
      let floor3dSel = null;
      let floorIdleTimer = 0;
      const doorbellEl = document.getElementById("doorbell");
      const doorbellImg = document.getElementById("doorbell-img");
      const doorbellOpen = document.getElementById("doorbell-open");
      const doorbellYes = document.getElementById("doorbell-yes");
      const doorbellTitle = document.getElementById("doorbell-title");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function ico(name) {
        return (
          '<svg class="glyph" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-join="round">' +
          (ICONS[name] || ICONS.climate) +
          "</svg>"
        );
      }
      function iconForHvac(m) {
        if (m === "heat" || m === "heating") return "flame";
        if (m === "cool" || m === "cooling") return "snowflake";
        if (m === "dry" || m === "drying") return "drop";
        if (m === "fan_only" || m === "fan") return "wind";
        if (m === "off") return "power";
        if (m === "heat_cool" || m === "auto") return "auto";
        return "climate";
      }
      function glyphForEntity(e) {
        const d = e && e.domain;
        if (d === "climate") return iconForHvac((e && (e.hvac_mode || e.state)) || "");
        if (d === "light") return "bulb";
        if (d === "switch") return "switch";
        if (d === "cover") return "blind";
        if (d === "media_player") return "music";
        return "climate";
      }
      function tileGlyph(name) {
        return '<span class="tile-ico">' + ico(name) + "</span>";
      }
      function hexRgb(hex) {
        const h = String(hex || "").replace("#", "");
        if (h.length !== 6) return "5,5,5";
        return parseInt(h.slice(0, 2), 16) + "," + parseInt(h.slice(2, 4), 16) + "," + parseInt(h.slice(4, 6), 16);
      }
      function applyTheme(s) {
        const t = (s && s.theme) || {};
        const preset = THEMES[t.preset] ? t.preset : "grafitis";
        const mode = t.mode === "light" ? "light" : "dark";
        const icons = t.icons === "filled" ? "filled" : "line";
        const pal = THEMES[preset][mode];
        const root = document.documentElement;
        root.dataset.preset = preset;
        root.dataset.mode = mode;
        root.dataset.icons = icons;
        root.style.setProperty("--bg", pal.bg);
        root.style.setProperty("--tile", pal.tile);
        root.style.setProperty("--ink", pal.ink);
        root.style.setProperty("--muted", pal.muted);
        root.style.setProperty("--on", pal.on);
        root.style.setProperty("--line", pal.line);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", pal.bg);
      }
      function tz() {
        return snap.timezone || "Europe/Athens";
      }
      function byId(id) {
        return snap.entities.find((e) => e.entity_id === id) || null;
      }
      function areaName(id) {
        const a = snap.areas.find((x) => x.area_id === id);
        return a ? a.name : id;
      }
      function lightsIn(areaId) {
        return snap.entities.filter((e) => e.domain === "light" && (!areaId || e.area_id === areaId));
      }
      function devicesIn(areaId) {
        return snap.entities.filter((e) => ROOM_DOMAINS[e.domain] && e.area_id === areaId);
      }
      function tileSize(t) {
        if (t.size === "l" || t.size === "m" || t.size === "s") return t.size;
        return t.span === 2 ? "m" : "s";
      }
      function clockText(d) {
        const date = d || new Date();
        try {
          return new Intl.DateTimeFormat("el-GR", {
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
            timeZone: tz(),
          }).format(date);
        } catch (e) {
          return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
        }
      }
      function dateText(d) {
        try {
          return new Intl.DateTimeFormat("el-GR", {
            weekday: "long",
            day: "numeric",
            month: "long",
            timeZone: tz(),
          }).format(d || new Date());
        } catch (e) {
          return "";
        }
      }
      function formatTemp(n) {
        if (typeof n !== "number" || !isFinite(n)) return "";
        return new Intl.NumberFormat("el-GR", { maximumFractionDigits: 1 }).format(n) + "°";
      }
      function weatherWord() {
        const w = snap.weather;
        if (!w) return "Καιρός";
        const c = w.condition || w.state;
        return (c && WX[c]) || c || "Καιρός";
      }
      function weatherTemp() {
        const w = snap.weather;
        if (!w || w.temperature == null) return "";
        return formatTemp(Number(w.temperature));
      }
      function entityWord(e) {
        if (!e) return "";
        const s = e.state;
        if (s === "on") return "αναμμένο";
        if (s === "off") return "σβηστό";
        if (s === "playing") return "παίζει";
        if (s === "paused") return "παύση";
        if (s === "idle") return "έτοιμο";
        if (s === "open" || s === "opening") return "ανοιχτό";
        if (s === "closed" || s === "closing") return "κλειστό";
        if (s === "heat") return "θέρμανση";
        if (s === "cool") return "ψύξη";
        if (s === "unavailable") return "εκτός";
        return s || "";
      }
      function tileOn(t) {
        if (t.kind === "entity") {
          const e = byId(t.ref);
          if (!e) return false;
          if (e.domain === "climate") return e.state && e.state !== "off" && e.state !== "unavailable";
          return e.state === "on" || e.state === "open" || e.state === "playing";
        }
        if (t.kind === "room") return lightsIn(t.ref).some((e) => e.state === "on");
        return false;
      }
      function timerRec() {
        try {
          return JSON.parse(localStorage.getItem(TIMER_KEY) || "null");
        } catch (e) {
          return null;
        }
      }
      function timerRemain() {
        const rec = timerRec();
        if (!rec || !rec.end) return 0;
        return Math.max(0, rec.end - Date.now());
      }
      function formatCountdown(ms) {
        const s = Math.max(0, Math.ceil(ms / 1000));
        return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }
      function startTimer(min) {
        localStorage.setItem(TIMER_KEY, JSON.stringify({ end: Date.now() + min * 60000, ringing: false }));
        paintTime();
        if (sheet && sheet.kind === "clock") renderSheet();
      }
      function clearTimer() {
        localStorage.removeItem(TIMER_KEY);
        paintTime();
        if (sheet && sheet.kind === "clock") renderSheet();
      }
      function ackTimer() {
        localStorage.removeItem(TIMER_KEY);
        paintTime();
        if (sheet && sheet.kind === "clock") renderSheet();
      }
      function beep() {
        try {
          const c = new AudioContext();
          const o = c.createOscillator();
          const g = c.createGain();
          o.connect(g);
          g.connect(c.destination);
          o.frequency.value = 880;
          g.gain.value = 0.12;
          o.start();
          o.stop(c.currentTime + 0.35);
        } catch (e) {}
      }

      async function cmd(action, entityId, payload) {
        if (!hubId) return;
        const body = { action, entity_id: entityId || "" };
        if (payload) body.payload = payload;
        await fetch("/v1/hubs/" + encodeURIComponent(hubId) + "/commands", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }
      async function toggleEntity(e) {
        if (!e) return;
        if (e.domain === "light" || e.domain === "switch") {
          await cmd(e.state === "on" ? e.domain + ".turn_off" : e.domain + ".turn_on", e.entity_id);
        } else if (e.domain === "cover") {
          await cmd(e.state === "open" || e.state === "opening" ? "cover.close_cover" : "cover.open_cover", e.entity_id);
        } else if (e.domain === "climate") {
          await cmd(e.state === "off" ? "climate.turn_on" : "climate.turn_off", e.entity_id);
        } else if (e.domain === "media_player") {
          await cmd(e.state === "playing" ? "media_player.media_pause" : "media_player.media_play", e.entity_id);
        }
      }
      function planForFloor(floorId) {
        return (snap.floor_plans || []).find((p) => p.floor_id === floorId) || null;
      }
      function planPoint(p) {
        if (p && typeof p.x === "number") return { x: p.x, y: p.y };
        if (Array.isArray(p) && p.length >= 2) return { x: Number(p[0]), y: Number(p[1]) };
        return null;
      }
      function fitPlan(plan) {
        let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
        (plan.rooms || []).forEach((r) => {
          (r.poly_cm || []).forEach((raw) => {
            const p = planPoint(raw);
            if (!p) return;
            minx = Math.min(minx, p.x);
            miny = Math.min(miny, p.y);
            maxx = Math.max(maxx, p.x);
            maxy = Math.max(maxy, p.y);
          });
        });
        (plan.pins || []).forEach((pin) => {
          minx = Math.min(minx, pin.x_cm);
          miny = Math.min(miny, pin.y_cm);
          maxx = Math.max(maxx, pin.x_cm);
          maxy = Math.max(maxy, pin.y_cm);
        });
        if (!Number.isFinite(minx)) return { x: 0, y: 0, w: 1200, h: 800 };
        const pad = 80;
        return { x: minx - pad, y: miny - pad, w: Math.max(400, maxx - minx + pad * 2), h: Math.max(300, maxy - miny + pad * 2) };
      }
      function pinLit(e) {
        if (!e) return false;
        if (e.domain === "climate") return e.state && e.state !== "off" && e.state !== "unavailable";
        return e.state === "on" || e.state === "open" || e.state === "playing";
      }
      function armFloorIdle() {
        clearTimeout(floorIdleTimer);
        floorIdleTimer = setTimeout(() => {
          if (!floor3dSel) return;
          floor3dSel = null;
          render();
        }, 60000);
      }
      function openPinSheet(eid) {
        const e = byId(eid) || { entity_id: eid, domain: String(eid).split(".")[0], state: "off" };
        if (e.domain === "climate") {
          openSheet({ kind: "climate", ref: eid });
          return;
        }
        if (e.area_id) openSheet({ kind: "room", ref: e.area_id });
      }
      async function tapPin(eid) {
        armFloorIdle();
        if (floor3dSel === eid) {
          openPinSheet(eid);
          return;
        }
        floor3dSel = eid;
        const e = byId(eid) || { entity_id: eid, domain: String(eid).split(".")[0], state: "off" };
        if (e.domain === "climate") {
          openSheet({ kind: "climate", ref: eid });
          render();
          return;
        }
        await toggleEntity(e);
        await load(true);
      }

      function armSheet() {
        clearTimeout(sheetTimer);
        sheetTimer = setTimeout(closeSheet, 30000);
      }
      function closeSheet() {
        sheet = null;
        clearTimeout(sheetTimer);
        sheetEl.classList.add("hidden");
        sheetBody.innerHTML = "";
        delete sheetEl.dataset.kind;
        delete sheetEl.dataset.hvac;
      }
      function sheetBack() {
        if (sheet && sheet.parent) openSheet(sheet.parent);
        else closeSheet();
      }
      function openSheet(next) {
        sheet = next;
        sheetEl.classList.remove("hidden");
        renderSheet();
        armSheet();
      }
      function renderSheet() {
        if (!sheet) return;
        sheetEl.dataset.kind = sheet.kind;
        if (sheet.kind !== "climate") delete sheetEl.dataset.hvac;
        if (sheet.kind === "clock") {
          const remain = timerRemain();
          const rec = timerRec();
          const ringing = rec && rec.ringing;
          sheetTitle.textContent = "Ρολόι";
          sheetSub.textContent = ringing ? "Τέλος" : remain ? "Χρονόμετρο " + formatCountdown(remain) : dateText();
          sheetBody.innerHTML =
            '<div class="sheet-clock' +
            (sheet.bold ? " bold" : "") +
            '" data-clock="1">' +
            esc(clockText()) +
            '</div><p class="sheet-date" data-date="1">' +
            esc(dateText()) +
            "</p>" +
            (ringing
              ? '<button type="button" class="chip" data-ack="1">ΟΚ</button>'
              : remain
                ? '<button type="button" class="chip" data-cancel="1">Ακύρωση · ' +
                  esc(formatCountdown(remain)) +
                  "</button>"
                : '<div class="presets">' +
                  [1, 5, 10, 15]
                    .map((n) => '<button type="button" class="chip" data-min="' + n + '">' + n + "′</button>")
                    .join("") +
                  "</div>");
        } else if (sheet.kind === "weather") {
          const w = snap.weather;
          const days = (w && w.forecast) || [];
          sheetTitle.textContent = "Καιρός";
          sheetSub.textContent = weatherWord();
          sheetBody.innerHTML =
            '<div class="wx-now"><div class="face' +
            (sheet.bold ? " bold" : "") +
            '" style="font-size:clamp(4rem,18vw,8rem)">' +
            esc(weatherTemp() || "—") +
            "</div><p class=\"kicker\">" +
            esc(weatherWord()) +
            "</p></div>" +
            (days.length
              ? '<div class="wx-days">' +
                days
                  .slice(0, 7)
                  .map((d) => {
                    const name = d.datetime
                      ? new Intl.DateTimeFormat("el-GR", { weekday: "short", timeZone: tz() }).format(new Date(d.datetime))
                      : "";
                    const hi = formatTemp(Number(d.temperature));
                    const lo = formatTemp(Number(d.templow));
                    return (
                      '<div class="wx-day"><span>' +
                      esc(name) +
                      "</span><b>" +
                      esc(lo && hi ? lo + " / " + hi : hi) +
                      "</b></div>"
                    );
                  })
                  .join("") +
                "</div>"
              : "");
        } else if (sheet.kind === "room") {
          const lights = lightsIn(sheet.ref);
          const anyOn = lights.some((e) => e.state === "on");
          const list = devicesIn(sheet.ref);
          sheetTitle.textContent = areaName(sheet.ref);
          sheetSub.textContent = anyOn ? lights.filter((e) => e.state === "on").length + " αναμμένα" : "σβηστά";
          sheetBody.innerHTML =
            (lights.length
              ? '<button type="button" class="chip" data-alloff="1">' +
                (anyOn ? "Σβήσε όλα" : "Άναψε όλα") +
                "</button>"
              : "") +
            '<div class="devices">' +
            (list.length
              ? list
                  .map((e) => {
                    const on = e.state === "on" || e.state === "open" || e.state === "playing";
                    return (
                      '<button type="button" class="device' +
                      (on ? " on" : "") +
                      '" data-eid="' +
                      esc(e.entity_id) +
                      '"><span>' +
                      esc(e.name) +
                      "</span><span class=\"state\">" +
                      esc(entityWord(e)) +
                      "</span></button>"
                    );
                  })
                  .join("")
              : "<p>Δεν υπάρχουν συσκευές σε αυτό το δωμάτιο.</p>") +
            "</div>";
        } else if (sheet.kind === "climate") {
          const e = byId(sheet.ref);
          const modes = (e && Array.isArray(e.hvac_modes) && e.hvac_modes.length ? e.hvac_modes : ["off", "heat", "cool"]);
          const mode = (e && (e.hvac_mode || e.state)) || "";
          const cur = e ? Number(e.current_temperature) : NaN;
          const target = e ? Number(e.temperature) : NaN;
          sheetEl.dataset.hvac = mode || "off";
          sheetTitle.textContent = e && e.name ? e.name : "Κλιματιστικό";
          sheetSub.textContent = HVAC[mode] || entityWord(e) || "";
          sheetBody.innerHTML =
            '<div class="clima"><div class="clima-hero"><div class="clima-now">' +
            esc(formatTemp(cur) || "—") +
            '</div><p class="clima-now-k">τώρα</p></div><div class="clima-set">' +
            '<button type="button" data-temp-step="-0.5" aria-label="Χαμηλότερα">−</button>' +
            '<div><div class="clima-target">' +
            esc(formatTemp(target) || "—") +
            '</div><p class="clima-target-k">στόχος</p></div>' +
            '<button type="button" data-temp-step="0.5" aria-label="Υψηλότερα">+</button>' +
            '</div><div class="clima-modes">' +
            modes
              .map((m) => {
                const label = HVAC[m] || m;
                return (
                  '<button type="button" class="clima-mode' +
                  (m === mode ? " on" : "") +
                  '" data-hvac="' +
                  esc(m) +
                  '">' +
                  ico(iconForHvac(m)) +
                  "<span>" +
                  esc(label) +
                  "</span></button>"
                );
              })
              .join("") +
            "</div></div>";
        }
      }

      async function tap(t) {
        if (t.kind === "clock") {
          openSheet({ kind: "clock", bold: !!t.bold });
          return;
        }
        if (t.kind === "weather") {
          openSheet({ kind: "weather", bold: !!t.bold });
          return;
        }
        if (t.kind === "room") {
          openSheet({ kind: "room", ref: t.ref });
          return;
        }
        if (t.kind === "entity" && t.ref) {
          const e = byId(t.ref) || { entity_id: t.ref, domain: t.ref.split(".")[0], state: "off" };
          if (e.domain === "climate") {
            openSheet({ kind: "climate", ref: t.ref });
            return;
          }
          await toggleEntity(e);
        } else if (t.kind === "allOff") {
          for (const e of lightsIn(t.ref)) await cmd("light.turn_off", e.entity_id);
        } else if (t.kind === "scene" && t.ref) {
          if (t.ref.startsWith("scene.")) await cmd("scene.turn_on", t.ref);
          else if (t.ref.startsWith("script.arvio_")) await cmd("script.turn_on", t.ref);
          else if (t.ref.startsWith("scenario:")) {
            await cmd("arvio.trigger_scenario", "", { scenario_id: t.ref.slice("scenario:".length) });
          }
        }
        await load(true);
      }

      function tileInner(t) {
        if (t.kind === "clock") {
          const remain = timerRemain();
          const rec = timerRec();
          const face = rec && rec.ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
          return (
            '<span class="face" data-clock="1">' +
            esc(face) +
            "</span><span class=\"state\" data-clock-sub=\"1\">" +
            esc(remain && !(rec && rec.ringing) ? "χρονόμετρο" : dateText()) +
            "</span>"
          );
        }
        if (t.kind === "weather") {
          return (
            '<span class="kicker">' +
            esc(weatherWord()) +
            '</span><span class="face">' +
            esc(weatherTemp() || "—") +
            "</span>"
          );
        }
        if (t.kind === "room") {
          const on = lightsIn(t.ref).filter((e) => e.state === "on").length;
          return (
            tileGlyph("bulb") +
            '<span class="name">' +
            esc(areaName(t.ref)) +
            '</span><span class="state">' +
            esc(on ? on + " αναμμένα" : "σβηστά") +
            "</span>"
          );
        }
        if (t.kind === "entity") {
          const e = byId(t.ref);
          const climateTemp = e && e.domain === "climate" ? formatTemp(Number(e.current_temperature)) : "";
          return (
            tileGlyph(glyphForEntity(e)) +
            '<span class="kicker"></span><span class="name">' +
            esc(e ? e.name : t.ref) +
            '</span><span class="state">' +
            esc(climateTemp || entityWord(e)) +
            "</span>"
          );
        }
        if (t.kind === "scene") {
          const e = byId(t.ref);
          return tileGlyph("scene") + '<span class="kicker">Σκηνή</span><span class="name">' + esc(e ? e.name : t.ref) + "</span>";
        }
        if (t.kind === "allOff") {
          return tileGlyph("power") + '<span class="kicker"></span><span class="name">Σβήσε όλα</span>';
        }
        if (t.kind === "security") {
          return tileGlyph("shield") + '<span class="kicker"></span><span class="name">Ασφάλεια</span>';
        }
        if (t.kind === "floor3d") {
          const plan = planForFloor(t.ref);
          if (!plan || !(plan.rooms || []).length) {
            return '<span class="kicker">Μακέτα</span><span class="name">Όχι έτοιμο</span>';
          }
          const view = fitPlan(plan);
          const rooms = (plan.rooms || [])
            .map((r) => {
              const pts = (r.poly_cm || []).map(planPoint).filter(Boolean);
              if (pts.length < 3) return "";
              const d = pts.map((p, i) => (i ? "L" : "M") + p.x + " " + p.y).join(" ") + " Z";
              const on = lightsIn(r.area_id).some((e) => e.state === "on");
              return '<path class="floor3d__room' + (on ? " on" : "") + '" data-room="' + esc(r.area_id) + '" d="' + d + '"/>';
            })
            .join("");
          const pins = (plan.pins || [])
            .map((pin) => {
              const e = byId(pin.entity_id);
              const on = pinLit(e);
              const sel = floor3dSel === pin.entity_id;
              return (
                '<g class="floor3d__pin' +
                (on ? " on" : "") +
                (sel ? " sel" : "") +
                '" data-pin="' +
                esc(pin.entity_id) +
                '"><circle cx="' +
                pin.x_cm +
                '" cy="' +
                pin.y_cm +
                '" r="' +
                (sel ? 48 : 36) +
                '"/></g>'
              );
            })
            .join("");
          const selected = floor3dSel ? byId(floor3dSel) : null;
          return (
            '<svg class="floor3d__svg" viewBox="' +
            view.x +
            " " +
            view.y +
            " " +
            view.w +
            " " +
            view.h +
            '" role="img" aria-label="Κάτοψη">' +
            rooms +
            pins +
            "</svg>" +
            (selected
              ? '<button type="button" class="floor3d__name" data-pin-name="' +
                esc(floor3dSel) +
                '">' +
                esc(selected.name || floor3dSel) +
                "</button>"
              : "")
          );
        }
        return '<span class="name">' + esc(t.kind) + "</span>";
      }

      function render() {
        if (!screen) return;
        document.documentElement.dataset.orientation = screen.orientation || "square";
        pagesEl.innerHTML = "";
        for (const page of screen.pages || []) {
          const el = document.createElement("section");
          el.className = "page";
          for (const t of page.tiles || []) {
            const size = tileSize(t);
            if (t.kind === "floor3d") {
              const wrap = document.createElement("div");
              wrap.className = "tile tile--floor3d" + (size !== "s" ? " wide" : "");
              wrap.dataset.size = size;
              wrap.innerHTML = tileInner(t);
              wrap.querySelectorAll("[data-pin]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tapPin(el.getAttribute("data-pin"));
                });
              });
              wrap.querySelectorAll("[data-pin-name]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  armFloorIdle();
                  openPinSheet(el.getAttribute("data-pin-name"));
                });
              });
              wrap.querySelectorAll("[data-room]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tap({ kind: "room", ref: el.getAttribute("data-room") });
                });
              });
              el.appendChild(wrap);
              continue;
            }
            const b = document.createElement("button");
            b.type = "button";
            b.className = "tile tile--" + t.kind + (size !== "s" ? " wide" : "") + (tileOn(t) ? " on" : "") + (t.bold ? " bold" : "");
            b.dataset.size = size;
            b.innerHTML = tileInner(t);
            b.addEventListener("click", () => tap(t));
            el.appendChild(b);
          }
          pagesEl.appendChild(el);
        }
        const kids = pagesEl.children;
        if (kids[pageIx]) kids[pageIx].scrollIntoView({ inline: "start", block: "nearest" });
      }

      function paintTime() {
        const rec = timerRec();
        if (rec && rec.end && Date.now() >= rec.end && !rec.ringing) {
          rec.ringing = true;
          localStorage.setItem(TIMER_KEY, JSON.stringify(rec));
          if (!sheet || sheet.kind !== "clock") openSheet({ kind: "clock" });
        }
        if (rec && rec.ringing && Date.now() - lastBeep > 2000) {
          lastBeep = Date.now();
          beep();
        }
        const remain = timerRemain();
        const ringing = rec && rec.ringing;
        const face = ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
        document.querySelectorAll("[data-clock]").forEach((el) => {
          el.textContent = face;
        });
        document.querySelectorAll("[data-clock-sub]").forEach((el) => {
          el.textContent = remain && !ringing ? "χρονόμετρο" : dateText();
        });
        document.querySelectorAll("[data-date]").forEach((el) => {
          el.textContent = dateText();
        });
        if (sheet && sheet.kind === "clock") {
          sheetSub.textContent = ringing ? "Τέλος" : remain ? "Χρονόμετρο " + formatCountdown(remain) : dateText();
        }
      }

      function applyWallpaper(s) {
        if (s && s.has_wallpaper) {
          var a = Number(s.wallpaper_scrim);
          if (!isFinite(a)) a = 0.55;
          a = Math.min(0.9, Math.max(0.1, a));
          var rgb = hexRgb(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
          document.body.style.backgroundImage =
            "linear-gradient(rgba(" + rgb + "," + a + "), rgba(" + rgb + "," + a + ")), url('/api/screens/wallpaper?id=" +
            encodeURIComponent(s.screen_id) + "&v=" + encodeURIComponent(s.updated_at || "") + "')";
          document.body.style.backgroundSize = "cover";
          document.body.style.backgroundPosition = "center";
        } else {
          document.body.style.backgroundImage = "";
        }
      }

      function doorbellJpegSrc() {
        if (!screen) return "";
        return "/api/screens/doorbell.jpg?id=" + encodeURIComponent(screen.screen_id) + "&t=" + Date.now();
      }
      function stopDoorbellJpeg() {
        if (doorbellJpegTimer) {
          clearInterval(doorbellJpegTimer);
          doorbellJpegTimer = null;
        }
      }
      function startDoorbellJpeg() {
        if (doorbellJpegTimer) return;
        doorbellImg.src = doorbellJpegSrc();
        doorbellJpegTimer = setInterval(function () {
          doorbellImg.src = doorbellJpegSrc();
        }, 1000);
      }
      function hideDoorbell() {
        doorbellEl.classList.add("hidden");
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.add("hidden");
        doorbellTitle.textContent = "Κάποιος στο κουδούνι";
        stopDoorbellJpeg();
      }
      function showDoorbell() {
        if (!doorbellEl.classList.contains("hidden")) return;
        const db = screen && screen.doorbell;
        doorbellEl.classList.remove("hidden");
        doorbellYes.classList.add("hidden");
        if (db && db.unlock_entity_id) doorbellOpen.classList.remove("hidden");
        else doorbellOpen.classList.add("hidden");
        startDoorbellJpeg();
      }
      function syncDoorbell() {
        const db = screen && screen.doorbell;
        const ringing = Boolean(db && db.ringing);
        if (!ringing) {
          doorbellWasRinging = false;
          doorbellDismissed = false;
          hideDoorbell();
          return;
        }
        if (!doorbellWasRinging) doorbellDismissed = false;
        doorbellWasRinging = true;
        if (doorbellDismissed) {
          hideDoorbell();
          return;
        }
        showDoorbell();
      }

      async function load(keepPage) {
        const sid = localStorage.getItem(KEY);
        const r = await fetch("/api/screens" + (sid ? "?screen_id=" + encodeURIComponent(sid) : ""));
        snap = await r.json();
        hubId = snap.hub_id || hubId;
        screen = (snap.screens || []).find((s) => s.screen_id === sid) || null;
        if (!screen) {
          localStorage.removeItem(KEY);
          gate.classList.remove("hidden");
          board.classList.add("hidden");
          applyTheme(null);
          applyWallpaper(null);
          hideDoorbell();
          closeSheet();
          return;
        }
        if (!keepPage) pageIx = 0;
        gate.classList.add("hidden");
        board.classList.remove("hidden");
        applyTheme(screen);
        applyWallpaper(screen);
        render();
        if (sheet) renderSheet();
        syncDoorbell();
      }

      async function pair() {
        gateErr.textContent = "";
        const code = document.getElementById("code").value.replace(/\D/g, "");
        if (code.length !== 6) {
          gateErr.textContent = "Έξι ψηφία.";
          return;
        }
        const r = await fetch("/api/screens/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok || !body.screen_id) {
          gateErr.textContent = "Λάθος ή ληγμένος κωδικός.";
          return;
        }
        localStorage.setItem(KEY, body.screen_id);
        await load(false);
      }

      document.getElementById("pair").addEventListener("click", pair);
      document.getElementById("code").addEventListener("keydown", (e) => {
        if (e.key === "Enter") pair();
      });
      document.getElementById("sheet-back").addEventListener("click", sheetBack);
      sheetEl.addEventListener("click", async (e) => {
        armSheet();
        const min = e.target.getAttribute && e.target.getAttribute("data-min");
        if (min) startTimer(Number(min));
        if (e.target.getAttribute && e.target.getAttribute("data-cancel")) clearTimer();
        if (e.target.getAttribute && e.target.getAttribute("data-ack")) ackTimer();
        if (e.target.getAttribute && e.target.getAttribute("data-alloff") && sheet && sheet.kind === "room") {
          const lights = lightsIn(sheet.ref);
          const anyOn = lights.some((x) => x.state === "on");
          for (const ent of lights) await cmd(anyOn ? "light.turn_off" : "light.turn_on", ent.entity_id);
          await load(true);
        }
        const stepBtn = e.target.closest && e.target.closest("[data-temp-step]");
        if (stepBtn && sheet && sheet.kind === "climate") {
          const ent = byId(sheet.ref);
          const cur = ent ? Number(ent.temperature) : NaN;
          const next = (isFinite(cur) ? cur : 21) + Number(stepBtn.getAttribute("data-temp-step"));
          const lo = ent ? Number(ent.min_temp) : NaN;
          const hi = ent ? Number(ent.max_temp) : NaN;
          const clamped = Math.min(isFinite(hi) ? hi : 32, Math.max(isFinite(lo) ? lo : 16, next));
          await cmd("climate.set_temperature", sheet.ref, { temperature: Math.round(clamped * 2) / 2 });
          await load(true);
          return;
        }
        const hvacBtn = e.target.closest && e.target.closest("[data-hvac]");
        if (hvacBtn && sheet && sheet.kind === "climate") {
          await cmd("climate.set_hvac_mode", sheet.ref, { hvac_mode: hvacBtn.getAttribute("data-hvac") });
          await load(true);
          return;
        }
        const eid = e.target.closest && e.target.closest("[data-eid]");
        if (eid) {
          const ent = byId(eid.getAttribute("data-eid"));
          if (ent && ent.domain === "climate") {
            openSheet({ kind: "climate", ref: ent.entity_id, parent: { kind: "room", ref: sheet && sheet.ref } });
            return;
          }
          await toggleEntity(ent);
          await load(true);
        }
      });
      document.getElementById("doorbell-dismiss").addEventListener("click", () => {
        doorbellDismissed = true;
        hideDoorbell();
      });
      doorbellOpen.addEventListener("click", () => {
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.remove("hidden");
        doorbellTitle.textContent = "Να ανοίξει η πόρτα;";
      });
      doorbellYes.addEventListener("click", async () => {
        if (!screen) return;
        doorbellYes.disabled = true;
        try {
          await fetch("/api/screens/doorbell/unlock", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ screen_id: screen.screen_id }),
          });
        } finally {
          doorbellYes.disabled = false;
          doorbellDismissed = true;
          hideDoorbell();
        }
      });
      pagesEl.addEventListener("scroll", () => {
        const w = pagesEl.clientWidth || 1;
        pageIx = Math.round(pagesEl.scrollLeft / w);
      });

      (async () => {
        try {
          const h = await fetch("/health").then((r) => r.json());
          hubId = h.hub_id;
        } catch (e) {}
        if (localStorage.getItem(KEY)) await load(true);
        setInterval(() => {
          if (screen) load(true).catch(() => {});
        }, 4000);
        setInterval(paintTime, 1000);
      })();
    </script>
  </body>
</html>

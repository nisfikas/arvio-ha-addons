<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Arvio</title>
    <style>
      :root {
        --ink: #f2f2f2;
        --muted: #9a9a9a;
        --bg: #050505;
        --tile: #121212;
        --line: #f2f2f218;
        --on: #f6e2c0;
        --heat: #d4a06a;
        --cool: #6aa8bc;
        --dry: #7a9ec4;
        --fan: #9aa3aa;
        --gap: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--tile);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; }
      #gate, #board { position: absolute; inset: 0; }
      #gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      #gate.hidden, #board.hidden, #sheet.hidden, #doorbell.hidden { display: none; }
      h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); }
      input {
        width: 12rem;
        font: inherit;
        font-size: 1.6rem;
        letter-spacing: 0.4em;
        text-align: center;
        padding: 0.7rem;
        border: 1px solid var(--line);
        background: var(--tile);
        color: var(--ink);
      }
      .err { color: #e55551; min-height: 1.2em; }
      .pages {
        display: flex;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .pages::-webkit-scrollbar { display: none; }
      .page {
        flex: 0 0 100%;
        scroll-snap-align: start;
        display: grid;
        gap: var(--gap);
        padding: var(--gap);
        padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        min-height: 100%;
      }
      html[data-orientation="landscape"] .page { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile {
        min-height: 0;
        min-width: 0;
        height: 100%;
        padding: 1rem 1.05rem;
        background: var(--tile);
        border: 1px solid var(--line);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), color 0.28s ease, box-shadow 0.28s ease;
      }
      .tile:active { transform: scale(0.975); }
      .tile[data-align="center"] { text-align: center; align-items: center; }
      .tile[data-align="right"] { text-align: right; align-items: flex-end; }
      .tile-ico {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 22px;
        height: 22px;
        color: var(--muted);
        opacity: 0.72;
        pointer-events: none;
      }
      .tile-ico svg { width: 22px; height: 22px; display: block; }
      .tile.on .tile-ico { color: var(--on); opacity: 1; }
      .tile-ico ~ .name { padding-right: 1.5rem; }
      html[data-icons="filled"] .glyph { stroke-width: 2.25; }
      html[data-mode="light"] .tile {
        box-shadow: 0 10px 28px rgba(20, 28, 36, 0.08);
      }
      .tile[data-size="m"], .tile.wide { grid-column: 1 / -1; }
      .tile[data-size="l"] { grid-column: 1 / -1; grid-row: span 2; }
      .tile--floor3d {
        padding: 8px;
        gap: 6px;
        justify-content: stretch;
      }
      .floor3d__svg {
        width: 100%;
        height: 100%;
        flex: 1;
        min-height: 0;
        display: block;
      }
      .floor3d__room {
        fill: color-mix(in srgb, var(--ink) 8%, var(--tile));
        stroke: var(--line);
        stroke-width: 8;
        vector-effect: non-scaling-stroke;
        transition: fill 0.32s ease;
      }
      .floor3d__room.on { fill: color-mix(in srgb, var(--on) 28%, var(--tile)); }
      .floor3d__room, .floor3d__pin { cursor: pointer; }
      .floor3d__pin circle {
        fill: var(--muted);
        stroke: var(--bg);
        stroke-width: 6;
        transition: fill 0.32s ease;
      }
      .floor3d__pin.on circle { fill: var(--on); }
      .floor3d__pin.sel circle { stroke: var(--on); }
      .floor3d__name {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        border: 0;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 12px;
        text-align: left;
      }
      @media (prefers-reduced-motion: reduce) {
        .floor3d__room, .floor3d__pin circle { transition: none; }
      }
      .tile.on { color: var(--on); }
      .kicker {
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 500;
      }
      .face {
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.06em;
        line-height: 0.95;
        font-size: clamp(2.4rem, 11vw, 4.4rem);
      }
      .tile.bold .face, .sheet-clock.bold, .face.bold { font-weight: 700; }
      .tile[data-size="m"] .face { font-size: clamp(3.4rem, 14vw, 6rem); }
      .tile[data-size="l"] .face { font-size: clamp(5rem, 22vw, 10rem); }
      .tile--clock, .tile--weather { container-type: size; }
      .tile--clock .face, .tile--weather .face {
        line-height: 0.88;
        font-size: clamp(2.8rem, 38cqh, 9rem);
      }
      .tile--clock[data-size="m"] .face, .tile--weather[data-size="m"] .face {
        font-size: clamp(3.8rem, 28vw, 12rem);
        font-size: clamp(3.8rem, 46cqh, 12rem);
      }
      .tile--clock[data-size="l"] .face, .tile--weather[data-size="l"] .face {
        font-size: clamp(6.2rem, 28vw, 14rem);
        font-size: clamp(6.2rem, 54cqh, 16rem);
      }
      .tile--clock .kicker, .tile--weather .kicker { font-size: clamp(1.05rem, 7cqh, 1.5rem); }
      .tile--clock .state { font-size: clamp(1.05rem, 8cqh, 1.65rem); }
      .tile--clock .kicker, .tile--clock .face, .tile--clock .state,
      .tile--weather .kicker, .tile--weather .face { position: relative; z-index: 1; }
      .colon { animation: colon-blink 1s steps(1) infinite; }
      .wx-sky {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .wx-glow, .wx-orb, .wx-cloud, .wx-fall { position: absolute; }
      .wx-glow { inset: 0; }
      .wx-orb {
        top: 12%;
        right: 10%;
        width: min(34%, 5.4rem);
        aspect-ratio: 1;
        border-radius: 50%;
      }
      .wx-orb::after {
        content: "";
        position: absolute;
        inset: -75%;
        background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--on) 32%, transparent) 0 7deg, transparent 7deg 32deg);
        mask: radial-gradient(circle, transparent 30%, #000 32%);
        -webkit-mask: radial-gradient(circle, transparent 30%, #000 32%);
        animation: wx-spin 38s linear infinite;
      }
      .wx-cloud {
        height: 22%;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ink) 16%, var(--tile));
        animation: wx-drift 14s ease-in-out infinite;
      }
      .wx-cloud.a { width: 44%; bottom: 24%; left: 4%; }
      .wx-cloud.b { width: 30%; height: 16%; bottom: 40%; left: 40%; opacity: 0.72; animation-delay: -5s; }
      .wx-fall { inset: 0; opacity: 0; }
      [data-wx="sun"] .wx-glow {
        background: radial-gradient(80% 70% at 82% 18%, color-mix(in srgb, var(--on) 42%, transparent), transparent 58%);
      }
      [data-wx="sun"] .wx-orb, [data-wx="partly"] .wx-orb {
        background: radial-gradient(circle at 38% 36%, #fff8ea, var(--on) 58%);
        box-shadow: 0 0 42px color-mix(in srgb, var(--on) 52%, transparent);
        animation: wx-pulse 5s ease-in-out infinite;
      }
      [data-wx="sun"] .wx-cloud { display: none; }
      [data-wx="sun"] .wx-fall { display: none; }
      [data-wx="partly"] .wx-glow {
        background: radial-gradient(70% 60% at 78% 16%, color-mix(in srgb, var(--on) 28%, transparent), transparent 55%);
      }
      [data-wx="partly"] .wx-orb { width: min(26%, 4.2rem); top: 10%; right: 16%; }
      [data-wx="night"] .wx-glow {
        background:
          radial-gradient(1.5px 1.5px at 18% 22%, var(--ink), transparent),
          radial-gradient(1.2px 1.2px at 42% 18%, var(--ink), transparent),
          radial-gradient(1.4px 1.4px at 70% 28%, var(--ink), transparent),
          radial-gradient(1px 1px at 28% 48%, var(--ink), transparent),
          radial-gradient(90% 70% at 82% 12%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 55%);
        animation: wx-twinkle 3.8s ease-in-out infinite;
      }
      [data-wx="night"] .wx-orb {
        background: radial-gradient(circle at 35% 35%, #f4f0e6 40%, #c8c2b4 100%);
        box-shadow: 0 0 28px color-mix(in srgb, var(--ink) 18%, transparent);
      }
      [data-wx="night"] .wx-orb::after, [data-wx="cloud"] .wx-orb, [data-wx="fog"] .wx-orb,
      [data-wx="rain"] .wx-orb, [data-wx="pour"] .wx-orb, [data-wx="snow"] .wx-orb,
      [data-wx="storm"] .wx-orb, [data-wx="wind"] .wx-orb { display: none; }
      [data-wx="night"] .wx-cloud { opacity: 0.22; }
      [data-wx="fog"] .wx-cloud { filter: blur(10px); opacity: 0.55; height: 42%; }
      [data-wx="wind"] .wx-cloud { animation-duration: 6s; }
      [data-wx="rain"] .wx-fall, [data-wx="pour"] .wx-fall, [data-wx="storm"] .wx-fall {
        opacity: 0.4;
        background: repeating-linear-gradient(-18deg, transparent 0 10px, color-mix(in srgb, var(--ink) 22%, transparent) 10px 11px);
        background-size: 16px 28px;
        animation: wx-fall 0.55s linear infinite;
      }
      [data-wx="pour"] .wx-fall { opacity: 0.55; animation-duration: 0.38s; }
      [data-wx="snow"] .wx-fall {
        opacity: 0.55;
        background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 70%, transparent) 1.1px, transparent 1.3px);
        background-size: 16px 16px;
        animation: wx-fall 2.6s linear infinite;
      }
      [data-wx="storm"] .wx-glow { animation: wx-flash 4.2s ease-in-out infinite; }
      @keyframes colon-blink { 50% { opacity: 0.18; } }
      @keyframes wx-spin { to { transform: rotate(360deg); } }
      @keyframes wx-pulse { 50% { transform: scale(1.06); } }
      @keyframes wx-drift { 50% { transform: translateX(10%); } }
      @keyframes wx-fall { to { background-position: 16px 28px; } }
      @keyframes wx-twinkle { 50% { opacity: 0.62; } }
      @keyframes wx-flash {
        0%, 86%, 94%, 100% { opacity: 0.2; background: transparent; }
        88%, 91% { opacity: 1; background: color-mix(in srgb, var(--ink) 30%, transparent); }
      }
      .name {
        font-size: clamp(1.15rem, 3.6vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .state { font-size: 1.05rem; color: var(--muted); }
      .tile.on .state { color: var(--on); opacity: 0.85; }
      #sheet {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 16px;
      }
      #sheet:not(.hidden) { animation: sheet-in 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes sheet-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      #sheet-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #sheet-back {
        width: 56px;
        height: 56px;
        min-width: 56px;
        min-height: 56px;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--line);
      }
      #sheet-back svg { display: block; }
      #sheet-title {
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      #sheet-sub { font-size: 1rem; }
      #sheet-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
      #sheet[data-kind="climate"] {
        padding-top: 10px;
        gap: 10px;
      }
      #sheet[data-kind="climate"] #sheet-body {
        overflow: hidden;
        justify-content: space-between;
      }
      #sheet[data-hvac="heat"] {
        background: radial-gradient(90% 70% at 50% 8%, rgba(212, 160, 106, 0.42), transparent 62%), var(--bg);
      }
      #sheet[data-hvac="cool"] {
        background: radial-gradient(90% 70% at 50% 8%, rgba(106, 168, 188, 0.4), transparent 62%), var(--bg);
      }
      #sheet[data-hvac="dry"] {
        background: radial-gradient(90% 70% at 50% 8%, rgba(122, 158, 196, 0.34), transparent 62%), var(--bg);
      }
      #sheet[data-hvac="fan_only"] {
        background: radial-gradient(90% 70% at 50% 8%, rgba(154, 163, 170, 0.28), transparent 62%), var(--bg);
      }
      html[data-mode="light"] #sheet[data-hvac="heat"] {
        background: radial-gradient(90% 70% at 50% 10%, rgba(212, 160, 106, 0.4), transparent 64%), var(--bg);
      }
      html[data-mode="light"] #sheet[data-hvac="cool"] {
        background: radial-gradient(90% 70% at 50% 10%, rgba(80, 148, 172, 0.38), transparent 64%), var(--bg);
      }
      .clima {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 12px;
      }
      .clima-dial {
        flex: 1;
        min-height: 7.2rem;
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) 72px;
        align-items: center;
        gap: 4px;
      }
      .clima-nudge {
        width: 72px;
        height: 72px;
        min-width: 72px;
        min-height: 72px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--tile);
        font-size: 2rem;
        font-weight: 200;
        line-height: 1;
        box-shadow: 0 10px 28px rgba(20, 28, 36, 0.08);
      }
      .clima-nudge:active { transform: scale(0.96); }
      .clima-face { text-align: center; min-width: 0; }
      .clima-target {
        font-variant-numeric: tabular-nums;
        font-weight: 200;
        letter-spacing: -0.07em;
        line-height: 0.88;
        font-size: clamp(3.6rem, 17vw, 5.6rem);
      }
      .clima-k {
        margin: 0.45rem 0 0;
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .clima-modes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      html[data-orientation="landscape"] .clima-modes {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .clima-mode {
        min-height: 64px;
        border-radius: 22px;
        padding: 8px 6px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 0.78rem;
        letter-spacing: 0.01em;
        line-height: 1.15;
        text-align: center;
        color: var(--muted);
        background: color-mix(in srgb, var(--tile) 72%, transparent);
        border: 1px solid transparent;
      }
      .clima-mode svg { display: block; }
      .clima-mode.on {
        color: var(--ink);
        background: var(--tile);
        box-shadow: 0 10px 28px rgba(20, 28, 36, 0.1);
      }
      .clima-mode[data-hvac="off"].on { color: var(--muted); }
      .clima-mode[data-hvac="heat"].on {
        color: var(--heat);
        background: color-mix(in srgb, var(--heat) 28%, var(--tile));
      }
      .clima-mode[data-hvac="cool"].on {
        color: var(--cool);
        background: color-mix(in srgb, var(--cool) 28%, var(--tile));
      }
      .clima-mode[data-hvac="dry"].on {
        color: var(--dry);
        background: color-mix(in srgb, var(--dry) 24%, var(--tile));
      }
      .clima-mode[data-hvac="fan_only"].on { color: var(--fan); }
      html[data-mode="light"] .clima-mode[data-hvac="heat"].on {
        color: #8a5a20;
        background: color-mix(in srgb, var(--heat) 46%, var(--tile));
      }
      html[data-mode="light"] .clima-mode[data-hvac="cool"].on {
        color: #2a6a88;
        background: color-mix(in srgb, var(--cool) 46%, var(--tile));
      }
      html[data-mode="light"] .clima-mode[data-hvac="dry"].on {
        color: #3a5a78;
        background: color-mix(in srgb, var(--dry) 42%, var(--tile));
      }
      html[data-orientation="landscape"] .clima-mode { min-height: 56px; }
      .clima-chips { display: grid; gap: 6px; flex: 0 0 auto; min-height: 0; overflow: auto; }
      .clima-chips > span {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .clima-chips div { display: flex; flex-wrap: wrap; gap: 8px; }
      .clima-chip {
        min-height: 44px;
        border-radius: 999px;
        padding: 0 16px;
        font-size: 0.88rem;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .clima-chip.on {
        color: var(--ink);
        background: var(--tile);
        border-color: color-mix(in srgb, var(--ink) 35%, transparent);
      }
      .sheet-clock {
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.07em;
        font-size: clamp(6.2rem, 28vw, 14rem);
        line-height: 0.88;
      }
      .sheet-date { font-size: 1.25rem; color: var(--muted); }
      .presets, .devices { display: grid; gap: 12px; }
      .presets { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .devices { grid-template-columns: 1fr; }
      .chip, .device {
        min-height: 72px;
        border-radius: 28px;
        padding: 0 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 1.2rem;
      }
      .chip.on { color: var(--on); }
      .step {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .step button {
        min-width: 72px;
        min-height: 72px;
        border-radius: 28px;
        font-size: 2rem;
      }
      .device.on { color: var(--on); }
      .room-all {
        align-self: flex-start;
        min-height: 0;
        padding: 0;
        background: transparent;
        border: 0;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .lamps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 10px;
        padding: 12px 0 8px;
      }
      html[data-orientation="landscape"] .lamps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .lamp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        min-height: 0;
        padding: 8px 6px 0;
        background: transparent;
        border: 0;
      }
      #sheet[data-kind="room"] #sheet-body { justify-content: flex-start; }
      .lamp-glow {
        width: clamp(5.2rem, 24vw, 8.6rem);
        height: clamp(5.2rem, 24vw, 8.6rem);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 70%);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 8%, transparent);
        transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
      }
      .lamp.on .lamp-glow {
        background: radial-gradient(circle at 50% 36%, #fff8ea 0%, var(--on) 36%, color-mix(in srgb, var(--on) 22%, transparent) 68%, transparent 100%);
        border-color: color-mix(in srgb, var(--on) 40%, transparent);
        box-shadow: 0 0 42px color-mix(in srgb, var(--on) 42%, transparent);
        animation: lamp-breathe 3.6s ease-in-out infinite;
      }
      @keyframes lamp-breathe {
        50% { box-shadow: 0 0 58px color-mix(in srgb, var(--on) 58%, transparent); }
      }
      .lamp-name {
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--muted);
        text-align: center;
        line-height: 1.2;
      }
      .lamp.on .lamp-name { color: var(--ink); }
      .room-rest {
        display: grid;
        gap: 8px;
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .room-rest .device {
        min-height: 56px;
        border-radius: 20px;
        font-size: 1.05rem;
      }
      .cv-window {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        background: color-mix(in srgb, var(--ink) 7%, var(--tile));
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .cv-glass {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--ink) 4%, transparent),

        if (m === "dry" || m === "drying") return "drop";
        if (m === "fan_only" || m === "fan") return "wind";

      function glyphForEntity(e) {

        if (d === "climate") return iconForHvac((e && (e.hvac_mode || e.state)) || "");
        if (d === "light") return "bulb";
        if (d === "switch") return "switch";

                ? '<button type="button" class="chip" data-cancel="1">Ακύρωση · ' +
                  esc(formatCountdown(remain)) +
                  "</button>"
                : '<div class="presets">' +
                  [1, 5, 10, 15]
                    .map((n) => '<button type="button" class="chip" data-min="' + n + '">' + n + "′</button>")
                    .join("") +
                  "</div>");
        } else if (sheet.kind === "weather") {
          const w = snap.weather;
          sheetTitle.textContent = "Καιρός";
          if (!w) {
            sheetSub.textContent = "";
            sheetBody.innerHTML = "<p>Ο καιρός χρειάζεται τη θέση του σπιτιού στο Home Assistant</p>";
          } else {
            const humidity = weatherHumidity();
            const hours = w.hourly || [];
            const days = w.forecast || [];
            sheetSub.textContent = humidity ? weatherWord() + " · " + humidity : weatherWord();
            sheetBody.innerHTML =
              '<div class="wx-now">' +
              wxSky(w.condition) +
              ico(wxIcon(w.condition), 48) +
              '<span class="wx-temp' +
              (sheet.bold ? " bold" : "") +
              '">' +
              esc(weatherTemp() || "—") +
              "</span></div>" +
              (hours.length
                ? '<section><p class="wx-label">Ώρες</p><div class="wx-hours">' +
                  hours
                    .map((h) => {
                      const mm = formatMm(Number(h.precipitation));
                      return (
                        '<div class="wx-hour"><time>' +
                        esc(hourLabel(h.datetime)) +
                        "</time>" +
                        ico(wxIcon(h.condition)) +
                        '<span class="wx-hour-temp">' +
                        esc(formatTemp(h.temperature, 0)) +
                        "</span>" +
                        (mm
                          ? '<span class="wx-hour-mm">' + esc(mm) + "</span>"
                          : '<span class="wx-hour-mm" aria-hidden="true"></span>') +
                        "</div>"
                      );
                    })
                    .join("") +
                  "</div></section>"
                : "") +
              (days.length
                ? '<section><p class="wx-label">Εβδομάδα</p><div class="wx-days">' +
                  days
                    .slice(0, 7)
                    .map((d) => {
                      return (
                        '<div class="wx-day"><span class="wx-day-name">' +
                        esc(dayLabel(d.datetime)) +
                        "</span>" +
                        ico(wxIcon(d.condition)) +
                        '<span class="wx-day-temps"><span class="wx-day-low">' +
                        esc(formatTemp(d.templow, 0)) +
                        "</span><b>" +
                        esc(formatTemp(d.temperature, 0)) +
                        "</b></span></div>"
                      );
                    })
                    .join("") +
                  "</div></section>"
                : "");
            centerWxNow();
          }
        } else if (sheet.kind === "room") {
          const lights = lightsForRoom(sheet.ref, sheet.lights);
          const anyOn = lights.some((e) => e.state === "on");
          const rest = devicesIn(sheet.ref).filter((e) => e.domain !== "light");
          sheetTitle.textContent = areaName(sheet.ref);
          sheetSub.textContent = lights.length
            ? anyOn
              ? lights.filter((e) => e.state === "on").length + " αναμμένα"
              : "σβηστά"
            : rest.length
              ? ""
              : "κενό";
          const covers = rest.filter((e) => e.domain === "cover");
          const other = rest.filter((e) => e.domain !== "cover");
          sheetBody.innerHTML =
            (lights.length
              ? '<button type="button" class="room-all" data-alloff="1">' +
                (anyOn ? "Σβήσε όλα" : "Άναψε όλα") +
                "</button><div class=\"lamps\">" +
                lights
                  .map((e) => {
                    return (
                      '<button type="button" class="lamp' +
                      (e.state === "on" ? " on" : "") +
                      '" data-eid="' +
                      esc(e.entity_id) +
                      '"><span class="lamp-glow" aria-hidden="true"></span><span class="lamp-name">' +
                      esc(e.name) +
                      "</span></button>"
                    );
                  })
                  .join("") +
                "</div>"
              : "") +
            (covers.length ? '<div class="covers">' + covers.map(coverCard).join("") + "</div>" : "") +
            (other.length
              ? '<div class="room-rest">' +
                other
                  .map((e) => {
                    const on =
                      e.state === "on" ||
                      e.state === "playing" ||
                      (e.domain === "climate" && e.state && e.state !== "off");
                    return (
                      '<button type="button" class="device' +
                      (on ? " on" : "") +
                      '" data-eid="' +
                      esc(e.entity_id) +
                      '"><span>' +
                      esc(e.name) +
                      "</span><span class=\"state\">" +
                      esc(entityWord(e)) +
                      "</span></button>"
                    );
                  })
                  .join("") +
                "</div>"
              : lights.length || covers.length
                ? ""
                : "<p>Δεν υπάρχουν συσκευές σε αυτό το δωμάτιο.</p>");
        } else if (sheet.kind === "security") {
          const alarms = securityAlarms();
          const locks = securityLocks();
          const openings = securityOpenings().slice().sort((a, b) => Number(openingOpen(b)) - Number(openingOpen(a)));
          const cameras = securityCameras();
          sheetTitle.textContent = securityWord();
          sheetSub.textContent = "Μόνο προβολή";
          const rows =
            alarms.map((e) => secRow(e.name, alarmWord(e.state), e.state === "triggered" ? "alert" : "")).join("") +
            locks
              .map((e) =>
                secRow(e.name, lockWord(e.state), e.state === "unlocked" || e.state === "jammed" ? "unlocked" : ""),
              )
              .join("") +
            openings
              .map((e) => secRow(e.name, openingOpen(e) ? "ανοιχτό" : "κλειστό", openingOpen(e) ? "open" : ""))
              .join("") +
            cameras.map((e) => secRow(e.name, "κάμερα", "")).join("");
          sheetBody.innerHTML =
            (rows ? '<div class="sec">' + rows + "</div>" : "<p>Δεν υπάρχουν αισθητήρες ασφαλείας σε αυτό το σπίτι.</p>") +
            '<p class="sec-note">Ξεκλείδωμα από το κινητό</p>';
        } else if (sheet.kind === "cover") {
          const e = byId(sheet.ref);
          const kind = coverKind(e);
          const garage = kind === "garage";
          const moving = e && (e.state === "opening" || e.state === "closing");
          sheetTitle.textContent = e && e.name ? e.name : "Κάλυμμα";
          sheetSub.textContent = coverWord(e);
          sheetBody.innerHTML =
            '<div class="cv" data-cover="' +
            kind +
            '" style="--cover-fill:' +
            coverFill(e) +
            '%"><div class="cv-hero">' +
            coverWindow() +
            '</div><div class="cv-btns"><button type="button" data-cover-act="open">' +
            (garage ? "Άνοιγμα πόρτας" : "Άνοιγμα") +
            '</button><button type="button"' +
            (moving ? ' class="on"' : "") +
            ' data-cover-act="stop">Στοπ</button><button type="button" data-cover-act="close">' +
            (garage ? "Κλείσιμο πόρτας" : "Κλείσιμο") +
            "</button></div></div>";
        } else if (sheet.kind === "climate") {
          const e = byId(sheet.ref);
          const modes = (e && Array.isArray(e.hvac_modes) && e.hvac_modes.length ? e.hvac_modes : ["off", "heat", "cool"]);
          const mode = (e && (e.hvac_mode || e.state)) || "";
          const cur = e ? Number(e.current_temperature) : NaN;
          const target = e ? Number(e.temperature) : NaN;
          const nowWord = formatTemp(cur);
          sheetEl.dataset.hvac = mode || "off";
          sheetTitle.textContent = e && e.name ? e.name : "Κλιματιστικό";
          sheetSub.textContent = HVAC[mode] || entityWord(e) || "";
          sheetBody.innerHTML =
            '<div class="clima"><div class="clima-dial">' +
            '<button type="button" class="clima-nudge" data-temp-step="-0.5" aria-label="Χαμηλότερα">−</button>' +
            '<div class="clima-face"><div class="clima-target">' +
            esc(formatTemp(target) || "—") +
            '</div><p class="clima-k">στόχος' +
            (nowWord && nowWord !== "—" ? " · τώρα " + esc(nowWord) : "") +
            "</p></div>" +
            '<button type="button" class="clima-nudge" data-temp-step="0.5" aria-label="Υψηλότερα">+</button>' +
            '</div><div class="clima-modes">' +
            modes
              .map((m) => {
                const label = HVAC[m] || m;
                return (
                  '<button type="button" class="clima-mode' +
                  (m === mode ? " on" : "") +
                  '" data-hvac="' +
                  esc(m) +
                  '">' +
                  ico(iconForHvac(m), 26) +
                  "<span>" +
                  esc(label) +
                  "</span></button>"
                );
              })
              .join("") +
            "</div>" +
            chipRow("Πρόγραμμα", e && e.preset_modes, e && e.preset_mode, "preset") +
            chipRow("Ανεμιστήρας", e && e.fan_modes, e && e.fan_mode, "fan") +
            chipRow("Περσίδες", e && e.swing_modes, e && e.swing_mode, "swing") +
            "</div>";
        }
      }

      async function tap(t) {
        if (t.kind === "clock") {
          openSheet({ kind: "clock", bold: !!t.bold });
          return;
        }
        if (t.kind === "weather") {
          openSheet({ kind: "weather", bold: !!t.bold });
          return;
        }
        if (t.kind === "room") {
          openSheet(roomSheet(t.ref, t.lights));
          return;
        }
        if (t.kind === "security") {
          openSheet({ kind: "security" });
          return;
        }
        if (t.kind === "entity" && t.ref) {
          const e = byId(t.ref) || { entity_id: t.ref, domain: t.ref.split(".")[0], state: "off" };
          if (e.domain === "climate") {
            openSheet({ kind: "climate", ref: t.ref });
            return;
          }
          if (e.domain === "cover") {
            openSheet({ kind: "cover", ref: t.ref });
            return;
          }
          toggleEntity(e);
          return;
        } else if (t.kind === "allOff") {
          for (const e of lightsIn(t.ref)) {
            setOverlay(e.entity_id, { state: "off" });
            cmd("light.turn_off", e.entity_id);
          }
          return;
        } else if (t.kind === "scene" && t.ref) {
          if (t.ref.startsWith("scene.")) cmd("scene.turn_on", t.ref);
          else if (t.ref.startsWith("script.arvio_")) cmd("script.turn_on", t.ref);
          else if (t.ref.startsWith("scenario:")) {
            cmd("arvio.trigger_scenario", "", { scenario_id: t.ref.slice("scenario:".length) });
          }
        }
      }

      function tileInner(t) {
        if (t.kind === "clock") {
          const remain = timerRemain();
          const rec = timerRec();
          const ringing = rec && rec.ringing;
          const face = ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
          return (
            '<span class="face" data-clock="1">' +
            clockFaceHtml(face, !ringing) +
            "</span><span class=\"state\" data-clock-sub=\"1\">" +
            esc(remain && !ringing ? "χρονόμετρο" : dateText()) +
            "</span>"
          );
        }
        if (t.kind === "weather") {
          return (
            wxSky(snap.weather && snap.weather.condition) +
            '<span class="kicker">' +
            esc(weatherWord()) +
            '</span><span class="face">' +
            esc(weatherTemp() || "—") +
            "</span>"
          );
        }
        if (t.kind === "room") {
          const on = lightsForRoom(t.ref, t.lights).filter((e) => e.state === "on").length;
          return (
            tileGlyph("bulb") +
            '<span class="name">' +
            esc(areaName(t.ref)) +
            '</span><span class="state">' +
            esc(on ? on + " αναμμένα" : "σβηστά") +
            "</span>"
          );
        }
        if (t.kind === "entity") {
          const e = byId(t.ref);
          if (e && e.domain === "cover") {
            return (
              coverWindow() +
              '<span class="name">' +
              esc(e.name) +
              '</span><span class="state">' +
              esc(coverWord(e)) +
              "</span>"
            );
          }
          const climateTemp = e && e.domain === "climate" ? formatTemp(Number(e.current_temperature)) : "";
          return (
            tileGlyph(glyphForEntity(e)) +
            '<span class="kicker"></span><span class="name">' +
            esc(e ? e.name : t.ref) +
            '</span><span class="state">' +
            esc(climateTemp || entityWord(e)) +
            "</span>"
          );
        }
        if (t.kind === "scene") {
          const e = byId(t.ref);
          return tileGlyph("scene") + '<span class="kicker">Σκηνή</span><span class="name">' + esc(e ? e.name : t.ref) + "</span>";
        }
        if (t.kind === "allOff") {
          return tileGlyph("power") + '<span class="kicker"></span><span class="name">Σβήσε όλα</span>';
        }
        if (t.kind === "security") {
          return (
            tileGlyph("shield") +
            '<span class="kicker">Ασφάλεια</span><span class="name">' +
            esc(securityWord()) +
            "</span>"
          );
        }
        if (t.kind === "floor3d") {
          const plan = planForFloor(t.ref);
          if (!plan || !(plan.rooms || []).length) {
            return '<span class="kicker">Μακέτα</span><span class="name">Όχι έτοιμο</span>';
          }
          const view = fitPlan(plan);
          const rooms = (plan.rooms || [])
            .map((r) => {
              const pts = (r.poly_cm || []).map(planPoint).filter(Boolean);
              if (pts.length < 3) return "";
              const d = pts.map((p, i) => (i ? "L" : "M") + p.x + " " + p.y).join(" ") + " Z";
              const on = lightsIn(r.area_id).some((e) => e.state === "on");
              return '<path class="floor3d__room' + (on ? " on" : "") + '" data-room="' + esc(r.area_id) + '" d="' + d + '"/>';
            })
            .join("");
          const pins = (plan.pins || [])
            .map((pin) => {
              const e = byId(pin.entity_id);
              const on = pinLit(e);
              const sel = floor3dSel === pin.entity_id;
              return (
                '<g class="floor3d__pin' +
                (on ? " on" : "") +
                (sel ? " sel" : "") +
                '" data-pin="' +
                esc(pin.entity_id) +
                '"><circle cx="' +
                pin.x_cm +
                '" cy="' +
                pin.y_cm +
                '" r="' +
                (sel ? 48 : 36) +
                '"/></g>'
              );
            })
            .join("");
          const selected = floor3dSel ? byId(floor3dSel) : null;
          return (
            '<svg class="floor3d__svg" viewBox="' +
            view.x +
            " " +
            view.y +
            " " +
            view.w +
            " " +
            view.h +
            '" role="img" aria-label="Κάτοψη">' +
            rooms +
            pins +
            "</svg>" +
            (selected
              ? '<button type="button" class="floor3d__name" data-pin-name="' +
                esc(floor3dSel) +
                '">' +
                esc(selected.name || floor3dSel) +
                "</button>"
              : "")
          );
        }
        if (t.kind === "session_countdown") {
          return (
            '<span class="kicker">Κράτηση</span><span class="face" data-session-count="1">' +
            esc((venueWall && venueWall.countdown) || "—") +
            "</span>"
          );
        }
        if (t.kind === "occupancy") {
          var occ = venueWall && venueWall.occupancy != null ? String(venueWall.occupancy) : "—";
          var max = venueWall && venueWall.occupancy_max ? "/" + venueWall.occupancy_max : "";
          return '<span class="kicker">Άτομα</span><span class="face" data-occupancy="1">' + esc(occ + max) + "</span>";
        }
        if (t.kind === "session_now") {
          var phase = venueWall && venueWall.phase ? venueWall.phase : "idle";
          var pkg = venueWall && venueWall.package_name ? venueWall.package_name : "Επόμενη";
          if (phase === "idle" && venueWall && venueWall.next_starts_at) {
            var nx = new Date(venueWall.next_starts_at);
            var nlabel = venueWall.next_package_name || "Κράτηση";
            if (!Number.isNaN(nx.getTime())) {
              nlabel += " " + new Intl.DateTimeFormat("el-GR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: tz() }).format(nx);
            }
            pkg = nlabel;
          }
          return (
            '<span class="kicker">' +
            esc(phase) +
            '</span><span class="name" data-session-now="1">' +
            esc(pkg) +
            "</span>"
          );
        }
        return '<span class="name">' + esc(t.kind) + "</span>";
      }

      function render() {
        if (!screen) return;
        document.documentElement.dataset.orientation = screen.orientation || "square";
        pagesEl.innerHTML = "";
        for (const page of screen.pages || []) {
          const el = document.createElement("section");
          el.className = "page";
          for (const t of page.tiles || []) {
            const size = tileSize(t);
            if (t.kind === "floor3d") {
              const wrap = document.createElement("div");
              wrap.className = "tile tile--floor3d" + (size !== "s" ? " wide" : "");
              wrap.dataset.size = size;
              wrap.innerHTML = tileInner(t);
              wrap.querySelectorAll("[data-pin]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tapPin(el.getAttribute("data-pin"));
                });
              });
              wrap.querySelectorAll("[data-pin-name]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  armFloorIdle();
                  openPinSheet(el.getAttribute("data-pin-name"));
                });
              });
              wrap.querySelectorAll("[data-room]").forEach((el) => {
                el.addEventListener("click", (ev) => {
                  ev.stopPropagation();
                  tap({ kind: "room", ref: el.getAttribute("data-room") });
                });
              });
              el.appendChild(wrap);
              continue;
            }
            const b = document.createElement("button");
            b.type = "button";
            b.className = "tile tile--" + t.kind + (size !== "s" ? " wide" : "") + (tileOn(t) ? " on" : "") + (t.bold ? " bold" : "");
            b.dataset.size = size;
            if (t.align === "center" || t.align === "right") b.dataset.align = t.align;
            if (t.kind === "entity") {
              const ent = byId(t.ref);
              if (ent && ent.domain === "cover") {
                b.classList.add("tile--cover");
                b.dataset.cover = coverKind(ent);
                b.style.setProperty("--cover-fill", coverFill(ent) + "%");
              }
            }
            b.innerHTML = tileInner(t);
            b.addEventListener("click", () => tap(t));
            el.appendChild(b);
          }
          pagesEl.appendChild(el);
        }
        const kids = pagesEl.children;
        if (kids[pageIx]) kids[pageIx].scrollIntoView({ inline: "start", block: "nearest" });
      }

      function paintTime() {
        const rec = timerRec();
        if (rec && rec.end && Date.now() >= rec.end && !rec.ringing) {
          rec.ringing = true;
          localStorage.setItem(TIMER_KEY, JSON.stringify(rec));
          if (!sheet || sheet.kind !== "clock") openSheet({ kind: "clock" });
        }
        if (rec && rec.ringing && Date.now() - lastBeep > 2000) {
          lastBeep = Date.now();
          beep();
        }
        const remain = timerRemain();
        const ringing = rec && rec.ringing;
        const face = ringing ? "Τέλος" : remain ? formatCountdown(remain) : clockText();
        document.querySelectorAll("[data-clock]").forEach((el) => {
          if (ringing || !el.querySelector(".colon")) {
            el.innerHTML = clockFaceHtml(face, !ringing);
            return;
          }
          const i = String(face).lastIndexOf(":");
          if (i < 1) {
            el.innerHTML = clockFaceHtml(face, !ringing);
            return;
          }
          const h = el.querySelector(".h");
          const m = el.querySelector(".m");
          if (h) h.textContent = face.slice(0, i);
          if (m) m.textContent = face.slice(i + 1);
        });
        document.querySelectorAll("[data-clock-sub]").forEach((el) => {
          el.textContent = remain && !ringing ? "χρονόμετρο" : dateText();
        });
        document.querySelectorAll("[data-date]").forEach((el) => {
          el.textContent = dateText();
        });
        if (sheet && sheet.kind === "clock") {
          sheetSub.textContent = ringing ? "Τέλος" : remain ? "Χρονόμετρο " + formatCountdown(remain) : dateText();
        }
        var sessionFace = (venueWall && venueWall.countdown) || "—";
        if (venueWall && venueWall.ends_at) {
          var left = Date.parse(venueWall.ends_at) - Date.now();
          if (Number.isFinite(left) && left > 0) sessionFace = formatCountdown(left);
          else if (Number.isFinite(left)) sessionFace = "—";
        }
        document.querySelectorAll("[data-session-count]").forEach((el) => {
          el.textContent = sessionFace;
        });
        var occFace = venueWall && venueWall.occupancy != null ? String(venueWall.occupancy) : "—";
        if (venueWall && venueWall.occupancy_max) occFace += "/" + venueWall.occupancy_max;
        document.querySelectorAll("[data-occupancy]").forEach((el) => {
          el.textContent = occFace;
        });
        document.querySelectorAll("[data-session-now]").forEach((el) => {
          var phase = venueWall && venueWall.phase ? venueWall.phase : "idle";
          var pkg = (venueWall && venueWall.package_name) || "Επόμενη";
          if (phase === "idle" && venueWall && venueWall.next_starts_at) {
            var nx = new Date(venueWall.next_starts_at);
            var nlabel = (venueWall.next_package_name || "Κράτηση");
            if (!Number.isNaN(nx.getTime())) {
              nlabel += " " + new Intl.DateTimeFormat("el-GR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: tz() }).format(nx);
            }
            pkg = nlabel;
          }
          el.textContent = pkg;
        });
      }

      function applyWallpaper(s) {
        if (s && s.has_wallpaper) {
          var a = Number(s.wallpaper_scrim);
          if (!isFinite(a)) a = 0.55;
          a = Math.min(0.9, Math.max(0.1, a));
          var rgb = hexRgb(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
          document.body.style.backgroundImage =
            "linear-gradient(rgba(" + rgb + "," + a + "), rgba(" + rgb + "," + a + ")), url('/api/screens/wallpaper?id=" +
            encodeURIComponent(s.screen_id) + "&v=" + encodeURIComponent(s.updated_at || "") + "')";
          document.body.style.backgroundSize = "cover";
          document.body.style.backgroundPosition = "center";
        } else {
          document.body.style.backgroundImage = "";
        }
      }

      function doorbellJpegSrc() {
        if (!screen) return "";
        return "/api/screens/doorbell.jpg?id=" + encodeURIComponent(screen.screen_id) + "&t=" + Date.now();
      }
      function stopDoorbellJpeg() {
        if (doorbellJpegTimer) {
          clearInterval(doorbellJpegTimer);
          doorbellJpegTimer = null;
        }
      }
      function startDoorbellJpeg() {
        if (doorbellJpegTimer) return;
        doorbellImg.src = doorbellJpegSrc();
        doorbellJpegTimer = setInterval(function () {
          doorbellImg.src = doorbellJpegSrc();
        }, 1000);
      }
      function hideDoorbell() {
        doorbellEl.classList.add("hidden");
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.add("hidden");
        doorbellTitle.textContent = "Κάποιος στο κουδούνι";
        stopDoorbellJpeg();
      }
      function showDoorbell() {
        if (!doorbellEl.classList.contains("hidden")) return;
        const db = screen && screen.doorbell;
        doorbellEl.classList.remove("hidden");
        doorbellYes.classList.add("hidden");
        if (db && db.unlock_entity_id) doorbellOpen.classList.remove("hidden");
        else doorbellOpen.classList.add("hidden");
        startDoorbellJpeg();
      }
      function syncDoorbell() {
        const db = screen && screen.doorbell;
        const ringing = Boolean(db && db.ringing);
        if (!ringing) {
          doorbellWasRinging = false;
          doorbellDismissed = false;
          hideDoorbell();
          return;
        }
        if (!doorbellWasRinging) doorbellDismissed = false;
        doorbellWasRinging = true;
        if (doorbellDismissed) {
          hideDoorbell();
          return;
        }
        showDoorbell();
      }

      async function load(keepPage) {
        const sid = localStorage.getItem(KEY);
        if (!sid) {
          screen = null;
          gate.classList.remove("hidden");
          board.classList.add("hidden");
          applyTheme(null);
          applyWallpaper(null);
          hideDoorbell();
          closeSheet();
          return;
        }
        let next;
        try {
          const r = await fetch("/api/screens?screen_id=" + encodeURIComponent(sid));
          if (!r.ok) return;
          next = await r.json();
        } catch (e) {
          return;
        }
        if (!next || !Array.isArray(next.screens)) return;
        const found = next.screens.find((s) => s.screen_id === sid) || null;
        if (!found) {
          if (next.screens.length === 0) return;
          miss += 1;
          if (miss < 3) return;
          localStorage.removeItem(KEY);
          miss = 0;
          screen = null;
          gate.classList.remove("hidden");
          board.classList.add("hidden");
          applyTheme(null);
          applyWallpaper(null);
          hideDoorbell();
          closeSheet();
          return;
        }
        miss = 0;
        snap = next;
        pruneOverlay();
        hubId = snap.hub_id || hubId;
        screen = found;
        if (!keepPage) pageIx = 0;
        gate.classList.add("hidden");
        board.classList.remove("hidden");
        applyTheme(screen);
        applyWallpaper(screen);
        try {
          const wr = await fetch("/api/venue/wall");
          if (wr.ok) venueWall = await wr.json();
        } catch (e) {}
        render();
        if (sheet) renderSheet();
        syncDoorbell();
        paintTime();
      }

      async function pair() {
        gateErr.textContent = "";
        const code = document.getElementById("code").value.replace(/\D/g, "");
        if (code.length !== 6) {
          gateErr.textContent = "Έξι ψηφία.";
          return;
        }
        const r = await fetch("/api/screens/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok || !body.screen_id) {
          gateErr.textContent = "Λάθος ή ληγμένος κωδικός.";
          return;
        }
        localStorage.setItem(KEY, body.screen_id);
        await load(false);
        armHomeIdle();
      }

      document.getElementById("pair").addEventListener("click", pair);
      document.getElementById("code").addEventListener("keydown", (e) => {
        if (e.key === "Enter") pair();
      });
      document.getElementById("sheet-back").addEventListener("click", sheetBack);
      sheetEl.addEventListener("click", async (e) => {
        armSheet();
        const min = e.target.getAttribute && e.target.getAttribute("data-min");
        if (min) startTimer(Number(min));
        if (e.target.getAttribute && e.target.getAttribute("data-cancel")) clearTimer();
        if (e.target.getAttribute && e.target.getAttribute("data-ack")) ackTimer();
        const allOffBtn = e.target.closest && e.target.closest("[data-alloff]");
        if (allOffBtn && sheet && sheet.kind === "room") {
          const lights = lightsForRoom(sheet.ref, sheet.lights);
          const anyOn = lights.some((x) => x.state === "on");
          const next = anyOn ? "off" : "on";
          for (const ent of lights) {
            setOverlay(ent.entity_id, { state: next });
            cmd(anyOn ? "light.turn_off" : "light.turn_on", ent.entity_id);
          }
          return;
        }
        const stepBtn = e.target.closest && e.target.closest("[data-temp-step]");
        if (stepBtn && sheet && sheet.kind === "climate") {
          const ent = byId(sheet.ref);
          const cur = ent ? Number(ent.temperature) : NaN;
          const next = (isFinite(cur) ? cur : 21) + Number(stepBtn.getAttribute("data-temp-step"));
          const lo = ent ? Number(ent.min_temp) : NaN;
          const hi = ent ? Number(ent.max_temp) : NaN;
          const clamped = Math.min(isFinite(hi) ? hi : 32, Math.max(isFinite(lo) ? lo : 16, next));
          const temp = Math.round(clamped * 2) / 2;
          const eid = sheet.ref;
          setOverlay(eid, { temperature: temp });
          clearTimeout(tempCommitTimer);
          tempCommitTimer = setTimeout(() => {
            cmd("climate.set_temperature", eid, { temperature: temp });
          }, 400);
          return;
        }
        const hvacBtn = e.target.closest && e.target.closest("[data-hvac]");
        if (hvacBtn && sheet && sheet.kind === "climate") {
          const mode = hvacBtn.getAttribute("data-hvac");
          setOverlay(sheet.ref, { hvac_mode: mode, state: mode });
          cmd("climate.set_hvac_mode", sheet.ref, { hvac_mode: mode });
          return;
        }
        const climaBtn = e.target.closest && e.target.closest("[data-clima]");
        if (climaBtn && sheet && sheet.kind === "climate") {
          const kind = climaBtn.getAttribute("data-clima");
          const val = climaBtn.getAttribute("data-val");
          if (kind === "preset") {
            setOverlay(sheet.ref, { preset_mode: val });
            cmd("climate.set_preset_mode", sheet.ref, { preset_mode: val });
          } else if (kind === "fan") {
            setOverlay(sheet.ref, { fan_mode: val });
            cmd("climate.set_fan_mode", sheet.ref, { fan_mode: val });
          } else if (kind === "swing") {
            setOverlay(sheet.ref, { swing_mode: val });
            cmd("climate.set_swing_mode", sheet.ref, { swing_mode: val });
          }
          return;
        }
        const coverBtn = e.target.closest && e.target.closest("[data-cover-act]");
        if (coverBtn && sheet && sheet.kind === "cover") {
          coverCommand(byId(sheet.ref), coverBtn.getAttribute("data-cover-act"));
          return;
        }
        const eid = e.target.closest && e.target.closest("[data-eid]");
        if (eid) {
          const ent = byId(eid.getAttribute("data-eid"));
          if (ent && ent.domain === "climate") {
            openSheet({
              kind: "climate",
              ref: ent.entity_id,
              parent: sheet && sheet.kind === "room" ? roomSheet(sheet.ref, sheet.lights) : undefined,
            });
            return;
          }
          if (ent && ent.domain === "cover") {
            openSheet({
              kind: "cover",
              ref: ent.entity_id,
              parent: sheet && sheet.kind === "room" ? roomSheet(sheet.ref, sheet.lights) : undefined,
            });
            return;
          }
          toggleEntity(ent);
        }
      });
      document.getElementById("doorbell-dismiss").addEventListener("click", () => {
        doorbellDismissed = true;
        hideDoorbell();
      });
      doorbellOpen.addEventListener("click", () => {
        doorbellOpen.classList.add("hidden");
        doorbellYes.classList.remove("hidden");
        doorbellTitle.textContent = "Να ανοίξει η πόρτα;";
      });
      doorbellYes.addEventListener("click", async () => {
        if (!screen) return;
        doorbellYes.disabled = true;
        try {
          await fetch("/api/screens/doorbell/unlock", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ screen_id: screen.screen_id }),
          });
        } finally {
          doorbellYes.disabled = false;
          doorbellDismissed = true;
          hideDoorbell();
        }
      });
      pagesEl.addEventListener("scroll", () => {
        const w = pagesEl.clientWidth || 1;
        pageIx = Math.round(pagesEl.scrollLeft / w);
      });
      document.addEventListener("pointerdown", armHomeIdle, { passive: true });

      (async () => {
        try {
          const h = await fetch("/health").then((r) => r.json());
          hubId = h.hub_id;
        } catch (e) {}
        if (localStorage.getItem(KEY)) {
          gate.classList.add("hidden");
          await load(true).catch(() => {});
          armHomeIdle();
        }
        setInterval(() => {
          if (localStorage.getItem(KEY)) load(true).catch(() => {});
        }, 4000);
        setInterval(paintTime, 1000);
      })();
    </script>
  </body>
</html>

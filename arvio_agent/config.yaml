name: "Arvio Agent"
version: "0.1.6"
slug: arvio_agent
description: "Arvio hub agent — local UI, claim, outbound cloud enroll + remote relay."
url: "https://github.com/nisfikas/arvio-ha-addons"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: default
host_network: false
stage: experimental
webui: "http://[HOST]:[PORT:8099]/"
watchdog: "http://[HOST]:[PORT:8099]/health"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Arvio local UI and agent API"
options:
  # Until DNS for cloud.arvio.systems is live, hubs use the Vercel alias.
  cloud_url: "https://arvio-cloud.vercel.app"
  serial: ""
  relay_url: "https://arvio-cloud.vercel.app"
  relay_token: "lab-relay-token"
schema:
  cloud_url: str
  serial: str?
  relay_url: str?
  relay_token: str?

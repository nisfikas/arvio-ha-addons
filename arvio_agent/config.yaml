name: "Arvio Agent"
version: "0.1.0"
slug: arvio_agent
description: "Local Arvio gateway for Home Assistant OS (lab). Enrolls with Arvio cloud and serves a simple local UI."
url: "https://github.com/nisfikas/arvio-ha-addons"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
stage: experimental
webui: "http://[HOST]:[PORT:8099]/"
watchdog: "http://[HOST]:[PORT:8099]/health"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Arvio local UI and agent API"
options:
  cloud_url: "http://192.168.68.71:8787"
  serial: "rpi-lab-1"
schema:
  cloud_url: str
  serial: str?

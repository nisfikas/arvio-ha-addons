<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arvio</title>
    <!--
      Guest TV: one page for every TV in a stay (docs/plans/2026-11-07-guest-tv.md in the monorepo, §3).
      One file: the hub inlines the fonts below when it serves /tv, so a TV can keep this page and draw
      it with no hub. Chromium M56 (2018 Samsung sets): no grid, gap, clamp/min/max, aspect-ratio, inset,
      :is, :focus-visible, #rrggbbaa; no spread, ?. ??, padStart (polyfilled for the signing block),
      finally, flat, globalThis. tests/test_guest_tv.py checks the list. The signing code is /panel/lan-sign.js,
      which the hub puts inline here.
    -->
    <style>
      @font-face { font-family: "Geologica"; font-weight: 100 900; font-display: swap; src: url("/panel/fonts/text-greek.woff2") format("woff2"); unicode-range: U+0370-03FF; }
      @font-face { font-family: "Geologica"; font-weight: 100 900; font-display: swap; src: url("/panel/fonts/text-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
      @font-face { font-family: "Sofia Sans Extra Condensed"; font-weight: 1 1000; font-display: swap; src: url("/panel/fonts/display-greek.woff2") format("woff2"); unicode-range: U+0370-03FF; }
      @font-face { font-family: "Sofia Sans Extra Condensed"; font-weight: 1 1000; font-display: swap; src: url("/panel/fonts/display-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
      :root { --bg: #141414; --tile: #1c1b1a; --ink: #eeebe5; --muted: #b5b0a6; --line: rgba(238, 235, 229, 0.12); --accent: #fddfbe; --signal: #c23d14; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Geologica", sans-serif; }
      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); }
      .safe { position: absolute; left: 96px; top: 54px; right: 96px; bottom: 54px; }
      .display { font-family: "Sofia Sans Extra Condensed", "Roboto Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.92; }
      .kicker { font-size: 26px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
      .bar { width: 64px; height: 6px; background: var(--signal); margin: 18px 0 20px; }
      /* the app's own card before content: Αφίσα, as the panel's «ΣΥΝΔΕΣΗ» (docs/brand) */
      #cover { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      #cover .card { width: 900px; border-top: 2px solid var(--line); padding-top: 28px; }
      #cover h1 { font-size: 132px; margin: 0; }
      #cover p { font-size: 34px; color: var(--muted); margin: 24px 0 0; line-height: 1.35; }
      #digits { display: flex; margin-top: 40px; }
      #digits button { width: 110px; height: 140px; margin-right: 18px; font-size: 88px; padding: 0; }
      #gateErr { color: var(--ink); border-left: 6px solid var(--signal); padding-left: 18px; }
      header { display: flex; align-items: flex-end; justify-content: space-between; height: 190px; border-bottom: 2px solid var(--line); }
      .head-left { display: flex; align-items: flex-end; }
      #logo { max-height: 150px; max-width: 360px; margin: 0 48px 22px 0; }
      #title { font-size: 112px; margin: 6px 0 0; }
      #welcomeText { font-size: 30px; color: var(--muted); margin: 10px 0 22px; max-width: 1100px; line-height: 1.3; }
      .head-right { text-align: right; padding-bottom: 22px; }
      #clock { font-size: 104px; }
      #date, #weather { font-size: 28px; color: var(--muted); margin-top: 6px; }
      #cols { position: absolute; left: 0; right: 0; top: 230px; bottom: 170px; overflow: hidden; }
      #flow { height: 100%; -webkit-columns: 3; columns: 3; -webkit-column-gap: 64px; column-gap: 64px; -webkit-column-fill: auto; column-fill: auto; transition: transform 0.6s ease; }
      .card { -webkit-column-break-inside: avoid; break-inside: avoid; page-break-inside: avoid; border-top: 2px solid var(--line); padding: 22px 0 40px; }
      .card h2 { font-size: 52px; margin: 8px 0 14px; }
      .card p, .card li { font-size: 30px; line-height: 1.38; margin: 0 0 8px; }
      .card ul { margin: 0; padding-left: 30px; }
      .row { display: flex; justify-content: space-between; font-size: 32px; padding: 6px 0; }
      .row b { font-weight: 600; }
      .today { border-left: 6px solid var(--signal); padding-left: 16px; margin-top: 12px; font-size: 32px; }
      .qr { display: flex; align-items: center; }
      .qr svg { width: 230px; height: 230px; background: #fff; padding: 12px; margin-right: 30px; flex: none; }
      .mono { font-family: "Geologica", monospace; font-weight: 600; font-size: 34px; word-break: break-all; }
      .phone { white-space: nowrap; word-break: normal; margin-bottom: 18px; }
      footer { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid var(--line); }
      #apps, #pager { display: flex; align-items: center; }
      button { font-family: "Sofia Sans Extra Condensed", sans-serif; font-weight: 800; text-transform: uppercase; color: var(--ink); background: var(--tile); border: 4px solid transparent; border-radius: 4px; height: 96px; padding: 0 40px; margin-right: 22px; font-size: 44px; cursor: pointer; transition: transform 0.12s ease; }
      button:focus, button.at { outline: none; border-color: var(--accent); -webkit-transform: scale(1.06); transform: scale(1.06); }
      #pager button { padding: 0 26px; font-size: 36px; height: 72px; margin-right: 0; margin-left: 14px; }
      #pager button.on { background: var(--ink); color: var(--bg); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="safe">
        <div id="cover">
          <div class="card">
            <div class="kicker">Arvio · <span id="coverKicker">Τηλεόραση</span></div>
            <div class="bar"></div>
            <h1 class="display" id="coverTitle">ΑΝΑΜΟΝΗ</h1>
            <p id="coverBody"></p>
            <div id="gate" hidden>
              <div id="digits"></div>
              <p id="gateErr" hidden></p>
            </div>
          </div>
        </div>
        <div id="main" hidden>
          <header>
            <div class="head-left">
              <img id="logo" alt="" hidden />
              <div>
                <div class="kicker" id="room"></div>
                <h1 class="display" id="title"></h1>
                <p id="welcomeText" hidden></p>
              </div>
            </div>
            <div class="head-right">
              <div class="display" id="clock" hidden></div>
              <div id="date" hidden></div>
              <div id="weather" hidden></div>
            </div>
          </header>
          <div id="cols"><div id="flow"></div></div>
          <footer>
            <div id="apps"></div>
            <div id="pager"></div>
          </footer>
        </div>
      </div>
    </div>

          var stayId = tv.stay ? tv.stay.id : null;
          if (langFor !== stayId) {
            lang = null; // a new guest starts in their own language again
            langFor = stayId;
          }
          if (!lang) lang = tv.stay && ph !== "after" ? tv.stay.language : "en";
          // <html lang="el"> stays: the partner's Greek keeps its capitals without accents in English too.
          applyTheme(tv.theme);
          var apps = appList(tv);
          var key = JSON.stringify([content.version, ph, lang, apps, preview ? tv : null]);
          if (key !== shown) {
            shown = key;
            var focused = document.activeElement && document.activeElement.getAttribute("data-key");
            var welcome = null;
            tv.blocks.forEach(function (b) {
              if (!welcome && b.kind === "welcome") welcome = b;
            });
            var name = tv.stay && tv.stay.guest_name && (ph === "before" || ph === "during") ? tv.stay.guest_name : "";
            var title = welcome ? tx(welcome.title) : t("welcome");
            $("title").textContent = name ? title + ", " + name : title;
            $("room").textContent = tv.name || "";
            var wt = welcome ? tx(welcome.text) : "";
            $("welcomeText").hidden = !wt;
            $("welcomeText").textContent = wt;
            var logo = $("logo");
            var hasLogo = hasBlock(tv, "logo") && tv.logo && /^image\/(png|jpeg)$/.test(tv.logo.mime);
            logo.hidden = !hasLogo;
            if (hasLogo) logo.src = "data:" + tv.logo.mime + ";base64," + tv.logo.data_base64;
            $("flow").innerHTML = cards(tv, ph, at);
            var bar = $("apps");
            bar.innerHTML = "";
            apps.forEach(function (a) {
              var b = document.createElement("button");
              b.textContent = appLabel(a);
              b.setAttribute("data-key", "app:" + a.id);
              b.onclick = function () {
                try {
                  if (bridge && bridge.launch) bridge.launch(a.id);
                } catch (e) {}
              };
              bar.appendChild(b);
            });
            var lb = document.createElement("button");
            lb.textContent = t("lang");
            lb.setAttribute("data-key", "lang");
            lb.onclick = function () {
              lang = lang === "el" ? "en" : "el";
              render();
            };
            bar.appendChild(lb);
            $("cover").hidden = true;
            $("main").hidden = false;
            paginate();
            var again = focused && document.querySelector('[data-key="' + focused + '"]');
            focusOn(again || bar.querySelector("button"));
          }
          tick();
        }

        function paginate() {
          var flow = $("flow");
          flow.style.transform = "";
          var width = $("cols").clientWidth + 64;
          pages = Math.max(1, Math.ceil((flow.scrollWidth + 64) / width));
          if (page >= pages) page = 0;
          var pager = $("pager");
          pager.innerHTML = "";
          if (pages > 1) {
            for (var i = 0; i < pages; i++) {
              var b = document.createElement("button");
              b.textContent = String(i + 1);
              b.setAttribute("data-key", "page:" + i);
              b.className = i === page ? "on" : "";
              b.onclick = (function (n) {
                return function () {
                  showPage(n);
                };
              })(i);
              pager.appendChild(b);
            }
          }
          showPage(page);
        }
        function showPage(n) {
          page = n;
          var width = $("cols").clientWidth + 64;
          $("flow").style.transform = "translateX(" + -n * width + "px)";
          var bs = $("pager").children;
          for (var i = 0; i < bs.length; i++) bs[i].className = i === n ? "on" : "";
        }

        function tick() {
          if (!content || !content.tv || $("main").hidden) return;
          var tv = content.tv;
          var at = nowMs();
          var showClock = hasBlock(tv, "clock") && at !== null;
          $("clock").hidden = $("date").hidden = !showClock;
          if (showClock) {
            $("clock").textContent = fmt(at, { hour: "2-digit", minute: "2-digit" });
            $("date").textContent = fmt(at, { weekday: "long", day: "numeric", month: "long" });
          }
          var w = content.weather;
          var fresh = w && typeof w.temperature === "number" && content.got && Date.now() - content.got < WEATHER_STALE_MS;
          $("weather").hidden = !(hasBlock(tv, "weather") && fresh);
          if (fresh) $("weather").textContent = Math.round(w.temperature) + "°" + (WEATHER[lang === "el" ? "el" : "en"][w.condition] ? " · " + WEATHER[lang === "el" ? "el" : "en"][w.condition] : "");
          if (phase(tv.stay, at) !== JSON.parse(shown || "[0,0]")[1]) render();
        }

        // ---- the remote: arrows move between buttons by where they are (Tizen and webOS have no spatial navigation)
        function move(dx, dy) {
          var all = Array.prototype.slice.call(document.querySelectorAll("button")).filter(function (b) {
            return b.offsetParent !== null;
          });
          var cur = document.activeElement;
          if (all.indexOf(cur) < 0) {
            focusOn(all[0]);
            return;
          }
          var a = cur.getBoundingClientRect();
          var ax = a.left + a.width / 2;
          var ay = a.top + a.height / 2;
          var best = null;
          var bestScore = Infinity;
          all.forEach(function (b) {
            if (b === cur) return;
            var r = b.getBoundingClientRect();
            var x = r.left + r.width / 2 - ax;
            var y = r.top + r.height / 2 - ay;
            var along = dx ? x * dx : y * dy;
            var across = dx ? Math.abs(y) : Math.abs(x);
            if (along <= 1) return;
            var score = along + across * 2;
            if (score < bestScore) {
              bestScore = score;
              best = b;
            }
          });
          focusOn(best);
        }
        document.addEventListener("keydown", function (e) {
          lastKey = Date.now();
          var k = e.keyCode;
          if (!$("gate").hidden && gateKey(e)) return e.preventDefault();
          if (k === 37 || k === 38 || k === 39 || k === 40) {
            e.preventDefault();
            move(k === 37 ? -1 : k === 39 ? 1 : 0, k === 38 ? -1 : k === 40 ? 1 : 0);
          } else if (k === 4 || k === 10009 || k === 461 || k === 8) {
            e.preventDefault(); // Back: the welcome page has nowhere to go back to
          }
        });

        function fit() {
          var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          var st = $("stage");
          st.style.transform = "translate(" + (window.innerWidth - 1920 * s) / 2 + "px," + (window.innerHeight - 1080 * s) / 2 + "px) scale(" + s + ")";
        }

        function alive() {
          try {
            if (bridge && bridge.alive) bridge.alive(!!screen);
          } catch (e) {}
        }

        // Partner's preview: the editor sends its draft; nothing is paired, polled or kept.
        window.addEventListener("message", function (e) {
          if (!preview || e.source !== window.parent || !e.data || !validTv(e.data.tv)) return;
          content = { version: "preview", tv: e.data.tv, weather: e.data.weather || null, got: Date.now(), timezone: e.data.timezone || "Europe/Athens" };
          lang = e.data.lang || null;
          langFor = e.data.tv.stay ? e.data.tv.stay.id : null;
          render();
        });

        // ---- start: draw what we have first, then ask the hub
        window.addEventListener("resize", function () {
          fit();
          if (!$("main").hidden) paginate();
        });
        fit();
        render();
        if (!preview) {
          if (!screen && /^[A-Za-z0-9_-]{43}$/.test(params.get("pair") || "")) pair({ token: params.get("pair") });
          poll();
          alive();
          setInterval(poll, POLL_MS);
          setInterval(alive, 30000);
        }
        setInterval(tick, 15000);
        setInterval(function () {
          if (pages > 1 && Date.now() - lastKey > PAGE_MS) showPage((page + 1) % pages);
        }, PAGE_MS);
      })();
    </script>
  </body>
</html>
